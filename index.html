17","Iman yang hidup tampak dalam perbuatan; iman tanpa perbuatan adalah mati."],["Serahkan Kekuatiranmu kepada-Nya","1 Petrus 5:7","Serahkan segala kekuatiran kepada Tuhan, sebab Ia memelihara kita."],["Kasih Menutupi Banyak Dosa","1 Petrus 4:8","Kasih yang bersungguh-sungguh menutupi banyak dosa; mari terus mengasihi satu sama lain."],["Allah adalah Kasih","1 Yohanes 4:8","Allah adalah kasih; mengenal Dia berarti belajar mengasihi."],["Mengaku Dosa dan Diampuni","1 Yohanes 1:9","Jika kita mengaku dosa, Allah setia dan adil mengampuni serta menyucikan kita."],["Yesus Berdiri dan Mengetuk","Wahyu 3:20","Yesus berdiri di depan pintu hati dan mengetuk; Ia ingin masuk dan bersekutu dengan kita."],["Menjadi Terang Dunia","Matius 5:14-16","Kita adalah terang dunia; hidup yang baik membuat orang lain memuliakan Bapa di surga."],["Utamakan Kerajaan Allah","Matius 6:33","Utamakan Kerajaan Allah dan kebenarannya, maka semua kebutuhan lain akan ditambahkan."],["Mintalah, Carilah, Ketuklah","Matius 7:7-8","Tuhan mengundang kita meminta, mencari, dan mengetuk; Ia menjawab dengan setia."],["Membangun di atas Batu","Matius 7:24-25","Hidup yang mendengar dan melakukan firman seperti rumah di atas batu: tetap kokoh ketika badai datang."],["Datanglah kepada-Ku","Matius 11:28-30","Yesus mengundang yang letih dan berbeban berat untuk datang kepada-Nya dan menemukan ketenangan."],["Amanat Agung","Matius 28:19-20","Yesus mengutus kita menjadikan semua bangsa murid-Nya, dan Ia menyertai kita sampai akhir zaman."],["Jangan Takut, Percaya Saja","Markus 5:36","Di tengah kabar buruk Yesus berkata: jangan takut, percaya saja."],["Bagi yang Percaya Tidak Ada yang Mustahil","Markus 9:23","Bagi orang yang percaya, tidak ada yang mustahil; datanglah dengan iman, sekecil apa pun."],["Menjadi Sesama bagi Orang Lain","Lukas 10:36-37","Sesama adalah orang yang menunjukkan belas kasihan; Yesus meminta kita pergi dan berbuat demikian."],["Bapa yang Menyambut Anak yang Pulang","Lukas 15:20-24","Bapa berlari menyambut anak yang pulang; kasih-Nya menerima kita kembali tanpa syarat."],["Bagi Allah Tidak Ada yang Mustahil","Lukas 1:37","Bagi Allah tidak ada yang mustahil, termasuk hal yang kita anggap tidak mungkin."],["Yesus Roti Hidup","Yohanes 6:35","Yesus adalah roti hidup; siapa datang kepada-Nya tidak akan lapar dan haus lagi."],["Jalan, Kebenaran, dan Hidup","Yohanes 14:6","Yesus adalah jalan, kebenaran, dan hidup; melalui Dia kita datang kepada Bapa."],["Damai Sejahtera dari Yesus","Yohanes 14:27","Damai dari Yesus berbeda dengan damai dunia; karena itu hati kita tidak perlu gelisah."],["Tinggal di dalam Pokok Anggur","Yohanes 15:4-5","Tanpa Yesus kita tidak dapat berbuat apa-apa; tinggal di dalam Dia membuahkan hidup yang berbuah."],["Saling Mengasihi","Yohanes 13:34-35","Saling mengasihi seperti Yesus mengasihi kita adalah tanda bahwa kita murid-Nya."],["Gembala yang Baik","Yohanes 10:10-11","Yesus, Gembala yang baik, datang supaya kita memiliki hidup yang berkelimpahan."],["Yesus Kebangkitan dan Hidup","Yohanes 11:25-26","Yesus adalah kebangkitan dan hidup; siapa percaya kepada-Nya akan hidup walaupun sudah mati."],["Aku Telah Mengalahkan Dunia","Yohanes 16:33","Di dunia ada kesusahan, tetapi kita dapat bertenang karena Yesus sudah mengalahkan dunia."],["Kuasa Roh Kudus","Kisah Para Rasul 1:8","Roh Kudus memberi kuasa kepada kita untuk menjadi saksi Kristus, mulai dari tempat kita berada."],["Percaya dan Diselamatkan","Roma 10:9-10","Mengaku Yesus adalah Tuhan dan percaya bahwa Allah membangkitkan-Nya membawa kita kepada keselamatan."],["Upah Dosa dan Karunia Allah","Roma 6:23","Upah dosa adalah maut, tetapi karunia Allah adalah hidup kekal dalam Kristus Yesus."],["Semua Telah Berbuat Dosa, Semua Dibenarkan","Roma 3:23-24","Semua orang berdosa, tetapi dengan cuma-cuma dibenarkan oleh kasih karunia melalui penebusan di dalam Kristus."],["Allah Menunjukkan Kasih-Nya","Roma 5:8","Allah menunjukkan kasih-Nya: Kristus mati bagi kita ketika kita masih berdosa."],["Mempersembahkan Hidup","Roma 12:1","Tanggapan terhadap kasih Allah adalah mempersembahkan seluruh hidup sebagai persembahan yang hidup dan kudus."],["Mengalahkan Kejahatan dengan Kebaikan","Roma 12:21","Jangan kalah oleh kejahatan, tetapi kalahkanlah kejahatan dengan kebaikan."],["Pengharapan Tidak Mengecewakan","Roma 5:3-5","Kesusahan melatih ketekunan dan membentuk pengharapan yang tidak mengecewakan karena kasih Allah dicurahkan dalam hati kita."],["Tubuh adalah Bait Roh Kudus","1 Korintus 6:19-20","Tubuh kita adalah bait Roh Kudus; kita sudah dibeli dengan harga lunas, maka muliakanlah Allah dengan tubuh kita."],["Kemenangan dalam Tuhan","1 Korintus 15:57-58","Allah memberi kemenangan melalui Yesus; karena itu teguhlah dan giat dalam pekerjaan Tuhan, sebab jerih payah kita tidak sia-sia."],["Memberi dengan Sukacita","2 Korintus 9:6-8","Allah mengasihi orang yang memberi dengan sukacita dan sanggup mencukupkan segala yang kita perlukan."],["Hidup karena Percaya","2 Korintus 5:7","Kita hidup karena percaya, bukan karena melihat."],["Hidup oleh Iman kepada Anak Allah","Galatia 2:20","Hidup kita sekarang adalah hidup oleh iman kepada Anak Allah yang mengasihi dan menyerahkan diri-Nya bagi kita."],["Jangan Jemu Berbuat Baik","Galatia 6:9","Jangan jemu berbuat baik, sebab pada waktunya kita akan menuai jika tidak menyerah."],["Allah Sanggup Melakukan Jauh Lebih Banyak","Efesus 3:20-21","Allah sanggup melakukan jauh lebih banyak daripada yang kita doakan atau pikirkan."],["Perkataan yang Membangun","Efesus 4:29","Biarlah perkataan kita membangun dan memberi kasih karunia bagi yang mendengar."],["Saling Mengampuni","Efesus 4:32","Saling mengampuni, karena Allah dalam Kristus telah lebih dahulu mengampuni kita."],["Pikirkan Hal-hal yang Benar dan Mulia","Filipi 4:8","Isi pikiran dengan hal yang benar, mulia, adil, suci, dan patut dipuji."],["Mengampuni seperti Tuhan Mengampuni","Kolose 3:13","Sabar dan ampunilah satu sama lain seperti Tuhan telah mengampuni kita."],["Allah Menghendaki Semua Orang Selamat","1 Timotius 2:3-4","Allah juru selamat kita menghendaki semua orang diselamatkan dan mengenal kebenaran."],["Seluruh Kitab Suci Diilhamkan Allah","2 Timotius 3:16-17","Seluruh Kitab Suci diilhamkan Allah dan memperlengkapi kita untuk setiap perbuatan baik."],["Menghampiri Takhta Kasih Karunia","Ibrani 4:16","Kita boleh datang dengan percaya diri ke takhta kasih karunia untuk menerima rahmat dan pertolongan."],["Firman Allah Hidup dan Tajam","Ibrani 4:12","Firman Allah hidup dan berkuasa; ia menembus dan menyingkapkan isi hati kita."],["Jadilah Pelaku Firman","Yakobus 1:22","Jangan hanya mendengar firman, tetapi jadilah pelakunya."],["Tunduk kepada Allah","Yakobus 4:7-8","Tunduk kepada Allah, lawan iblis, dan mendekatlah kepada Allah, maka Ia akan mendekat kepada kita."],["Kuasa Doa Orang Benar","Yakobus 5:16","Doa orang benar sangat besar kuasanya; saling mengaku dosa dan saling mendoakan membawa pemulihan."],["Firman-Mu Pelita bagi Kakiku","Mazmur 119:105","Firman Tuhan adalah pelita bagi kaki dan terang bagi jalan kita."],["Berlindung pada Yang Mahatinggi","Mazmur 91:1-2","Siapa berlindung pada Yang Mahatinggi mendapat tempat aman; Tuhan adalah tempat perlindungan dan kubu pertahanan kita."],["Tuhan Terangku dan Keselamatanku","Mazmur 27:1","Tuhan adalah terang dan keselamatan kita, sehingga tidak ada yang perlu kita takuti."],["Dijadikan dengan Dahsyat dan Ajaib","Mazmur 139:13-14","Kita dibentuk Allah dengan dahsyat dan ajaib; kita berharga di mata-Nya."],["Orang yang Berbahagia","Mazmur 1:1-3","Orang yang merenungkan firman Tuhan siang dan malam seperti pohon di tepi sungai yang berbuah pada waktunya."],["Serahkan Rencanamu kepada Tuhan","Amsal 16:3","Serahkan segala rencana kepada Tuhan, maka usaha kita akan Ia teguhkan."],["Kuasa Lidah","Amsal 18:21","Lidah berkuasa atas hidup dan mati; pakailah untuk memberkati."],["Jagalah Hatimu","Amsal 4:23","Jagalah hati dengan segala kewaspadaan, karena dari situlah terpancar kehidupan."],["Mendapat Kekuatan Baru","Yesaya 40:31","Orang yang menanti-nantikan Tuhan mendapat kekuatan baru dan tidak menjadi lelah."],["Jangan Takut, Aku Menyertaimu","Yesaya 41:10","Jangan takut, sebab Tuhan menyertai, meneguhkan, dan menolong kita."],["Dipanggil dengan Namamu","Yesaya 43:1-2","Tuhan menebus dan memanggil kita dengan nama; Ia menyertai kita melewati air dan api."],["Rancangan Damai Sejahtera","Yeremia 29:11","Rancangan Tuhan bagi kita adalah damai sejahtera, memberi masa depan yang penuh harapan."],["Berserulah kepada-Ku","Yeremia 33:3","Tuhan mengundang kita berseru kepada-Nya, dan Ia akan menjawab dengan hal-hal besar yang belum kita ketahui."],["Kasih Setia-Nya Baru Tiap Pagi","Ratapan 3:22-23","Kasih setia Tuhan tidak berkesudahan dan selalu baru setiap pagi; besar kesetiaan-Nya."],["Allah Kami Sanggup Melepaskan","Daniel 3:17-18","Allah kita sanggup melepaskan; tetapi sekalipun tidak, kita tetap setia kepada-Nya."],["Tuhan Bersukacita atas Kita","Zefanya 3:17","Tuhan menyertai kita, bersukacita karena kita, dan membaharui kita dengan kasih-Nya."],["Sukacita Tuhan adalah Kekuatan","Nehemia 8:10","Sukacita karena Tuhan adalah kekuatan kita."],["Ke Mana Engkau Pergi, Aku Pergi","Rut 1:16","Kesetiaan Rut kepada Naomi mengajarkan komitmen yang setia dalam mengikuti Allah dan mengasihi sesama."],["Kuat dan Teguh Hati","Yosua 1:9","Kuat dan teguhlah, jangan takut, sebab Tuhan Allah menyertai kita ke mana pun kita pergi."],["Tuhan Berperang bagi Kita","Keluaran 14:14","Tuhan berperang bagi kita; bagian kita adalah tenang dan percaya."],["Tuhan Memberkati dan Menjaga","Bilangan 6:24-26","Tuhan memberkati, menjaga, menyinari dengan wajah-Nya, dan memberi damai sejahtera kepada kita."],["Tuhan Melihat Hati","1 Samuel 16:7","Manusia melihat penampilan, tetapi Tuhan melihat hati; hidup kita perlu jujur di hadapan-Nya."],["Diciptakan menurut Gambar Allah","Kejadian 1:27","Kita diciptakan menurut gambar Allah, sehingga setiap orang berharga dan bermartabat."]];
const REFT=[["Hari Perhentian","Kejadian 2:2-3","Allah sendiri beristirahat dan menguduskan hari ketujuh; istirahat adalah bagian dari rencana-Nya bagi kita.","Sediakan satu waktu minggu ini untuk benar-benar berhenti bekerja dan menikmati hadirat Tuhan.","Apa yang sulit Anda lepaskan saat harus beristirahat?","Tuhan, ajar kami beristirahat dalam Engkau dan percaya bahwa Engkau yang memelihara. Amin."],["Dipanggil untuk Menjadi Berkat","Kejadian 12:1-2","Allah memanggil Abram keluar dari zona nyaman dan berjanji memberkatinya supaya ia menjadi berkat.","Tanyakan pada diri: langkah iman apa yang Tuhan minta, dan siapa yang bisa saya berkati?","Apa yang perlu Anda tinggalkan supaya taat pada panggilan Tuhan?","Tuhan, beri kami keberanian untuk taat dan hati yang mau menjadi berkat. Amin."],["Tuhan Menyediakan","Kejadian 22:14","Abraham mengalami bahwa Tuhan menyediakan pada saat yang tepat, sehingga tempat itu dinamai \"TUHAN menyediakan\".","Saat kekurangan, ingat kesetiaan Tuhan di masa lalu dan taat pada langkah yang sudah jelas.","Kapan Anda pernah mengalami Tuhan menyediakan tepat waktu?","Bapa, terima kasih Engkau menyediakan. Tolong kami percaya pada penyediaan-Mu hari ini. Amin."],["Tuhan Ada di Tempat Ini","Kejadian 28:15-16","Yakub sedang melarikan diri, tetapi Tuhan berjanji menyertai dan menjaganya; Tuhan hadir bahkan saat kita tidak menyadarinya.","Latih diri mengenali penyertaan Tuhan di rumah, tempat kerja, dan perjalanan hari ini.","Di mana Anda merasa Tuhan jauh, padahal Ia mungkin sedang menyertai?","Tuhan, buka mata kami untuk melihat Engkau hadir di setiap tempat dan keadaan. Amin."],["Yang Jahat Diubah Menjadi Baik","Kejadian 50:20","Yusuf melihat bahwa apa yang direncanakan saudara-saudaranya untuk kejahatan, Allah ubah menjadi kebaikan untuk menyelamatkan banyak orang.","Serahkan luka akibat perlakuan orang kepada Tuhan dan percaya Ia sanggup memakainya bagi kebaikan.","Luka mana yang masih sulit Anda serahkan kepada Tuhan?","Tuhan, sembuhkan hati kami dan ajar kami melihat tangan-Mu bekerja di masa sulit. Amin."],["Aku Akan Menyertai Engkau","Keluaran 3:11-12","Ketika Musa merasa tidak mampu, Allah tidak menyangkal kelemahannya, tetapi berjanji menyertainya.","Bila tugas terasa terlalu besar, fokus pada siapa yang menyertai kita, bukan pada kemampuan kita.","Tugas apa yang membuat Anda merasa tidak mampu saat ini?","Tuhan, kami lemah, tetapi Engkau menyertai. Pakailah kami sesuai kehendak-Mu. Amin."],["Menguduskan Hari Sabat","Keluaran 20:8-10","Hari perhentian adalah anugerah Allah untuk mengingat bahwa Ia yang memelihara hidup kita.","Tetapkan irama istirahat dan ibadah yang sehat bersama keluarga.","Apa yang biasanya menyita waktu ibadah dan istirahat Anda?","Tuhan, tolong kami menempatkan Engkau lebih dahulu dalam waktu kami. Amin."],["Kasihilah Tuhan Allahmu","Ulangan 6:5-7","Mengasihi Tuhan dengan segenap hati, jiwa, dan kekuatan perlu diteruskan lewat percakapan sehari-hari di rumah.","Bicarakan firman Tuhan bersama keluarga di meja makan atau dalam perjalanan.","Bagaimana firman Tuhan bisa menjadi bagian percakapan keluarga Anda?","Tuhan, tanamkan kasih kepada-Mu dalam hati kami dan keluarga kami. Amin."],["Tuhan Tidak Akan Meninggalkan Engkau","Ulangan 31:8","Tuhan berjalan di depan kita dan tidak akan meninggalkan kita, sehingga kita tidak perlu takut atau patah hati.","Saat menghadapi hal baru, ingatkan diri bahwa Tuhan sudah lebih dahulu ada di sana.","Hal baru apa yang membuat Anda takut hari ini?","Tuhan, terima kasih Engkau berjalan di depan kami. Kuatkan hati kami. Amin."],["Aku dan Seisi Rumahku","Yosua 24:15","Setiap kita harus memilih siapa yang dilayani; Yosua dengan tegas memilih melayani Tuhan bersama keluarganya.","Ambil satu keputusan nyata agar rumah tangga Anda makin melayani Tuhan, misalnya doa bersama.","Siapa atau apa yang paling sering mengambil tempat Tuhan dalam hidup Anda?","Tuhan, kami memilih melayani Engkau. Teguhkan keluarga kami. Amin."],["Pertempuran adalah Milik Tuhan","1 Samuel 17:45","Daud menghadapi Goliat bukan dengan senjata, melainkan dengan nama Tuhan semesta alam.","Hadapi \"raksasa\" Anda dengan bersandar pada nama Tuhan sambil melakukan bagian Anda dengan setia.","Raksasa apa yang sedang Anda hadapi saat ini?","Tuhan, kami datang dalam nama-Mu. Berikan kami keberanian dan kemenangan. Amin."],["Berbicaralah, Tuhan, Hamba-Mu Mendengar","1 Samuel 3:10","Samuel belajar menjawab panggilan Tuhan dengan sikap mau mendengar.","Sediakan waktu hening tanpa ponsel untuk mendengarkan Tuhan lewat firman-Nya.","Kapan terakhir kali Anda sungguh-sungguh diam untuk mendengarkan Tuhan?","Tuhan, bicaralah; kami mau mendengar dan taat. Amin."],["Merendahkan Diri dan Berbalik","2 Tawarikh 7:14","Tuhan berjanji mendengar, mengampuni, dan memulihkan umat yang merendahkan diri, berdoa, dan berbalik dari jalan yang jahat.","Mintalah Tuhan menunjukkan satu hal yang perlu Anda akui dan tinggalkan.","Apa satu hal yang perlu Anda akui di hadapan Tuhan hari ini?","Tuhan, kami merendahkan diri. Ampuni kami dan pulihkan hidup serta bangsa kami. Amin."],["Penebusku Hidup","Ayub 19:25","Di tengah kehilangan, Ayub berpegang bahwa Penebusnya hidup; pengharapan kita ada pada Tuhan yang hidup.","Saat penderitaan datang, nyatakan keyakinan Anda kepada Tuhan meski belum mengerti.","Apa yang menolong Anda tetap berharap di masa sulit?","Tuhan, Engkau Penebus kami yang hidup. Kuatkan pengharapan kami. Amin."],["Sukacita di Hadirat-Mu","Mazmur 16:11","Tuhan menunjukkan jalan kehidupan; di hadirat-Nya ada sukacita yang berlimpah.","Mulai hari dengan beberapa menit hadir di hadapan Tuhan sebelum melakukan hal lain.","Apa yang biasanya merebut sukacita Anda dari hadirat Tuhan?","Tuhan, penuhi kami dengan sukacita dalam hadirat-Mu. Amin."],["Langit Menceritakan Kemuliaan Allah","Mazmur 19:2","Ciptaan menyatakan kemuliaan Allah setiap hari dan mengajak kita mengagumi Sang Pencipta.","Luangkan waktu memandang langit atau alam hari ini dan ucapkan syukur kepada Pencipta.","Apa dalam ciptaan yang paling membuat Anda kagum akan Tuhan?","Tuhan Pencipta, kami memuji-Mu atas ciptaan yang indah. Amin."],["Kecaplah dan Lihatlah","Mazmur 34:9","Kebaikan Tuhan dapat dialami, bukan hanya diketahui; kita diundang mencicipinya sendiri.","Catat tiga kebaikan Tuhan yang Anda alami minggu ini.","Kebaikan Tuhan apa yang paling nyata Anda rasakan baru-baru ini?","Tuhan, terima kasih atas kebaikan-Mu yang kami alami. Amin."],["Bergembira karena Tuhan","Mazmur 37:4-5","Bergembira dalam Tuhan dan menyerahkan hidup kepada-Nya membuat kita dituntun oleh-Nya.","Serahkan satu rencana atau kekuatiran hari ini kepada Tuhan dalam doa.","Apa yang sulit Anda serahkan kepada Tuhan?","Tuhan, kami serahkan jalan hidup kami kepada-Mu. Amin."],["Diamlah dan Ketahuilah","Mazmur 46:11","Di tengah hiruk-pikuk, Tuhan mengajak kita diam dan mengenal Dia sebagai Allah yang berkuasa.","Matikan gawai selama sepuluh menit dan berdiam di hadapan Tuhan.","Apa yang paling bising dalam pikiran Anda saat ini?","Tuhan, tenangkan hati kami agar mengenal Engkau lebih dalam. Amin."],["Hati yang Tahir","Mazmur 51:12","Daud memohon hati yang tahir dan roh yang teguh; hanya Allah yang dapat memperbarui hati kita.","Datanglah kepada Tuhan dengan jujur, akui kesalahan, dan mintalah pembaruan.","Bagian hati mana yang perlu dibersihkan Tuhan?","Tuhan, ciptakanlah hati yang tahir dalam kami dan perbarui roh kami. Amin."],["Hanya pada Allah Jiwaku Tenang","Mazmur 62:2-3","Allah adalah gunung batu, keselamatan, dan kota benteng, sehingga jiwa kita boleh tenang.","Ketika cemas, ulangi ayat ini dan serahkan beban kepada-Nya.","Pada apa Anda biasa mencari rasa aman selain Tuhan?","Tuhan, Engkau tempat perlindungan kami. Tenangkan jiwa kami. Amin."],["Ajarlah Kami Menghitung Hari","Mazmur 90:12","Menyadari singkatnya hidup membuat kita bijaksana dalam memakai waktu.","Tulis satu hal yang paling penting dan lakukan hari ini.","Bagaimana Anda memakai waktu minggu ini? Sudahkah selaras dengan kehendak Tuhan?","Tuhan, ajar kami menghargai hari dan hidup dengan bijaksana. Amin."],["Bersorak bagi Tuhan","Mazmur 100:1-5","Kita diundang beribadah dengan sukacita karena Tuhan baik dan kasih setia-Nya untuk selama-lamanya.","Mulai hari dengan menyanyikan satu lagu pujian atau mengucap syukur dengan sukacita.","Apa alasan Anda bersorak bagi Tuhan hari ini?","Tuhan, kami bersyukur dan memuji-Mu karena Engkau baik. Amin."],["Pujilah Tuhan, Hai Jiwaku","Mazmur 103:1-5","Jangan melupakan segala kebaikan Tuhan: Ia mengampuni, menyembuhkan, dan memuaskan hidup kita dengan yang baik.","Tuliskan beberapa kebaikan Tuhan dan ucapkan sebagai syukur.","Kebaikan Tuhan apa yang mudah Anda lupakan?","Tuhan, jiwa kami memuji-Mu; jangan biarkan kami melupakan kebaikan-Mu. Amin."],["Pertolonganku Datang dari Tuhan","Mazmur 121:1-2","Pertolongan sejati datang dari Tuhan, pencipta langit dan bumi.","Ketika butuh pertolongan, berdoalah lebih dahulu sebelum mencari jalan lain.","Dari mana biasanya Anda mencari pertolongan pertama?","Tuhan, kami menengadah kepada-Mu, penolong kami. Amin."],["Tuhan yang Membangun Rumah","Mazmur 127:1","Tanpa Tuhan, usaha membangun rumah tangga dan pekerjaan menjadi sia-sia.","Undang Tuhan dalam rencana keluarga dan pekerjaan Anda lewat doa.","Bagian mana dari rumah tangga Anda yang perlu diserahkan lagi kepada Tuhan?","Tuhan, bangunlah keluarga dan pekerjaan kami. Amin."],["Rukun Bersama Saudara","Mazmur 133:1","Betapa baik dan indahnya kalau saudara-saudara diam bersama dengan rukun.","Ambil langkah kecil memperbaiki hubungan, misalnya menyapa atau meminta maaf.","Dengan siapa Anda perlu berdamai?","Tuhan, jadikan kami rukun dalam keluarga dan komsel. Amin."],["Selidikilah Aku, Ya Allah","Mazmur 139:23-24","Daud mengundang Allah memeriksa hatinya dan menuntunnya di jalan yang kekal.","Berdoalah dengan jujur dan biarkan Tuhan menunjukkan hal yang perlu diubah.","Apa yang Tuhan ingin tunjukkan dalam hati Anda?","Tuhan, selidiki hati kami dan tuntun kami di jalan-Mu. Amin."],["Tuhan Dekat pada Semua yang Berseru","Mazmur 145:18","Tuhan dekat kepada semua yang berseru kepada-Nya dengan sungguh-sungguh.","Berdoalah apa adanya, seperti berbicara kepada Bapa.","Apa yang ingin Anda serukan kepada Tuhan hari ini?","Tuhan, terima kasih Engkau dekat. Dengarkan seruan kami. Amin."],["Jawaban yang Lemah Lembut","Amsal 15:1","Jawaban yang lemah lembut meredakan amarah, sedangkan perkataan yang pedas membangkitkannya.","Saat tersinggung, tarik napas dan jawab dengan tenang.","Dalam situasi apa Anda sering membalas dengan keras?","Tuhan, kendalikan lidah kami dan beri kami kelemahlembutan. Amin."],["Sahabat Sepanjang Waktu","Amsal 17:17","Sahabat sejati mengasihi setiap waktu dan menjadi saudara dalam kesukaran.","Hubungi satu teman yang sedang berat dan hadir untuknya.","Siapa yang perlu Anda temani hari ini?","Tuhan, jadikan kami sahabat yang setia. Amin."],["Mendidik Anak Sejak Dini","Amsal 22:6","Pendidikan iman sejak kecil membentuk arah hidup anak.","Doakan anak atau keponakan Anda dan ajarkan satu nilai iman lewat teladan.","Teladan apa yang sedang Anda tunjukkan kepada anak-anak?","Tuhan, beri hikmat kepada para orang tua dan pendidik. Amin."],["Ada Waktu untuk Segala Sesuatu","Pengkhotbah 3:1","Segala sesuatu ada masanya; Tuhan berdaulat atas setiap musim hidup kita.","Terimalah musim hidup Anda sekarang dan cari apa yang Tuhan ajarkan di dalamnya.","Di musim apa Anda sekarang?","Tuhan, ajar kami sabar dalam setiap musim. Amin."],["Ini Aku, Utuslah Aku","Yesaya 6:8","Setelah mengalami pengampunan, Yesaya menjawab panggilan Tuhan dengan kesediaan.","Katakan \"ya\" pada satu kesempatan melayani minggu ini.","Pelayanan apa yang Tuhan letakkan di hati Anda?","Tuhan, ini kami, utuslah kami. Amin."],["Oleh Bilur-bilur-Nya Kita Sembuh","Yesaya 53:5","Yesus tertikam karena pemberontakan kita; oleh bilur-bilur-Nya kita menerima kesembuhan dan damai.","Bersyukur atas salib dan lepaskan rasa bersalah yang sudah diampuni.","Apa arti salib bagi Anda hari ini?","Tuhan Yesus, terima kasih telah menanggung dosa kami. Amin."],["Rancangan-Ku Bukan Rancanganmu","Yesaya 55:8-9","Pikiran Tuhan lebih tinggi dari pikiran kita, sehingga kita belajar percaya meski belum mengerti.","Saat jalan hidup tidak sesuai harapan, tetap percaya bahwa Tuhan tahu yang terbaik.","Kapan Anda sulit memahami cara Tuhan bekerja?","Tuhan, kami percaya rancangan-Mu lebih baik. Amin."],["Damai yang Sempurna","Yesaya 26:3","Orang yang teguh hati dan percaya kepada Tuhan dijagai-Nya dalam damai sejahtera.","Arahkan pikiran kepada Tuhan saat cemas, misalnya dengan menyebut janji-Nya.","Apa yang paling mengganggu damai Anda?","Tuhan, jagalah kami dalam damai-Mu. Amin."],["Apa yang Dituntut Tuhan","Mikha 6:8","Tuhan menuntut kita berlaku adil, mencintai kesetiaan, dan hidup dengan rendah hati di hadapan-Nya.","Pilih satu tindakan adil atau penuh kasih setia yang bisa Anda lakukan hari ini.","Di mana Anda perlu lebih adil atau rendah hati?","Tuhan, ajar kami berlaku adil dan rendah hati. Amin."],["Sekalipun, Namun","Habakuk 3:17-18","Habakuk tetap bersorak kepada Tuhan meski tidak ada hasil panen; sukacita tidak bergantung pada keadaan.","Syukuri Tuhan hari ini meski situasi belum berubah.","Apa yang membuat Anda sulit bersyukur saat ini?","Tuhan, sekalipun sulit, kami tetap bersukacita dalam-Mu. Amin."],["Setia Memberi","Maleakhi 3:10","Tuhan mengundang umat-Nya setia membawa persembahan dan melihat pemeliharaan-Nya.","Bawa persembahan dengan sukacita dan percaya bahwa Tuhan memelihara.","Apa yang menghalangi Anda memberi dengan sukacita?","Tuhan, ajar kami setia dan murah hati. Amin."],["Pembawa Damai","Matius 5:9","Orang yang membawa damai disebut anak-anak Allah; damai bukan sekadar tidak berkonflik, tetapi diusahakan.","Jadilah penengah yang tenang di rumah, kerja, atau komsel saat ada ketegangan.","Di mana Anda dipanggil menjadi pembawa damai?","Tuhan, jadikan kami pembawa damai di mana pun kami berada. Amin."],["Kasihilah Musuhmu","Matius 5:44","Yesus mengajar kita mengasihi musuh dan mendoakan orang yang menganiaya, supaya hati kita serupa dengan Bapa.","Doakan dengan nama satu orang yang sulit Anda kasihi, dan mintalah kebaikan baginya.","Siapa yang paling sulit Anda doakan?","Tuhan, lembutkan hati kami dan ajar kami mengasihi seperti Engkau. Amin."],["Berdoa di Tempat Tersembunyi","Matius 6:6","Bapa yang melihat di tempat tersembunyi menyambut doa yang tulus, bukan doa untuk dilihat orang.","Siapkan waktu dan tempat tenang untuk berdoa tanpa gangguan.","Apa yang menghalangi Anda berdoa secara pribadi?","Bapa, kami rindu bersekutu dengan-Mu secara pribadi. Amin."],["Doa Bapa Kami","Matius 6:9-13","Doa yang diajarkan Yesus memuliakan Bapa lebih dahulu, lalu memohon kebutuhan, pengampunan, dan perlindungan.","Doakan Doa Bapa Kami perlahan hari ini, renungkan satu baris yang paling menyentuh.","Baris mana dari doa ini yang paling Anda butuhkan hari ini?","Bapa kami di surga, jadilah kehendak-Mu dalam hidup kami. Amin."],["Jangan Menghakimi","Matius 7:1-2","Ukuran yang kita pakai untuk menghakimi orang akan dipakai pula terhadap kita; kita perlu belajar belas kasihan.","Tahan diri dari komentar menghakimi hari ini, dan ganti dengan doa untuk orang tersebut.","Terhadap siapa Anda cenderung cepat menghakimi?","Tuhan, ampuni kami yang mudah menghakimi; penuhi kami dengan belas kasihan. Amin."],["Harta yang Terpendam","Matius 13:44","Kerajaan Surga begitu berharga sehingga orang yang menemukannya rela melepaskan segalanya dengan sukacita.","Pertimbangkan apa yang perlu Anda lepaskan agar lebih mengutamakan Tuhan.","Apa yang paling sulit Anda lepaskan demi Tuhan?","Tuhan, jadikan Engkau harta terbesar dalam hidup kami. Amin."],["Seperti Anak Kecil","Matius 18:3-4","Yesus mengajar bahwa orang yang merendahkan diri seperti anak kecil adalah yang terbesar dalam Kerajaan Surga.","Datang kepada Tuhan dengan hati sederhana, percaya, dan tanpa kepura-puraan.","Di mana kerendahan hati Anda diuji akhir-akhir ini?","Tuhan, ajar kami percaya dan rendah hati seperti anak kecil. Amin."],["Mengampuni Tujuh Puluh Kali Tujuh","Matius 18:21-22","Pengampunan bukan hitungan; Yesus meminta kita mengampuni tanpa batas karena kita sudah diampuni lebih dahulu.","Putuskan hari ini untuk mengampuni satu orang yang pernah menyakiti Anda.","Siapa yang masih sulit Anda ampuni?","Tuhan, beri kami kekuatan mengampuni seperti Engkau mengampuni kami. Amin."],["Yang Terbesar adalah Pelayan","Matius 23:11-12","Dalam Kerajaan Allah, kebesaran diukur dari pelayanan, dan orang yang merendahkan diri akan ditinggikan.","Cari satu kesempatan melayani orang lain tanpa menunggu diminta.","Siapa yang bisa Anda layani hari ini?","Tuhan, ajar kami melayani dengan rendah hati. Amin."],["Hamba yang Baik dan Setia","Matius 25:21","Tuan memuji hamba yang setia dengan sedikit dan memberinya tanggung jawab lebih besar serta sukacita bersama tuannya.","Kerjakan tugas kecil hari ini dengan setia, seolah dilihat Tuhan.","Tanggung jawab kecil apa yang sering Anda anggap remeh?","Tuhan, jadikan kami hamba yang baik dan setia. Amin."],["Melayani yang Paling Hina","Matius 25:40","Apa yang kita lakukan bagi saudara yang paling hina, kita lakukan bagi Yesus sendiri.","Sisihkan waktu atau sumber daya untuk membantu satu orang yang membutuhkan.","Siapa di sekitar Anda yang sedang membutuhkan pertolongan?","Tuhan, buka mata kami melihat sesama yang membutuhkan. Amin."],["Ikutlah Aku","Markus 1:17","Yesus memanggil murid-murid-Nya untuk mengikut Dia dan Ia akan menjadikan mereka penjala manusia.","Tanyakan pada Tuhan langkah mengikut Dia yang perlu Anda ambil minggu ini.","Apa yang perlu Anda tinggalkan untuk lebih sungguh mengikut Yesus?","Tuhan Yesus, kami mau mengikut Engkau sepenuh hati. Amin."],["Yesus Menenangkan Badai","Markus 4:39-40","Yesus berkuasa atas angin dan danau, dan Ia menegur ketakutan murid-murid yang kurang percaya.","Saat badai hidup datang, ingat bahwa Yesus ada di dalam perahu bersama kita.","Badai apa yang sedang Anda hadapi dan sudahkah Anda memanggil Yesus?","Tuhan, tenangkan badai dalam hidup kami dan tambahkan iman kami. Amin."],["Imanmu Telah Menyelamatkan Engkau","Markus 5:34","Seorang perempuan menjamah jubah Yesus dengan iman dan Yesus memulihkan serta memberinya damai.","Datanglah kepada Yesus dengan kebutuhan Anda, sekecil apa pun imannya.","Kebutuhan apa yang ingin Anda bawa kepada Yesus hari ini?","Tuhan Yesus, kami datang kepada-Mu dengan iman. Pulihkan dan beri kami damai. Amin."],["Datang untuk Melayani","Markus 10:45","Anak Manusia datang bukan untuk dilayani, melainkan melayani dan memberikan nyawa-Nya sebagai tebusan.","Teladani Yesus dengan melayani seseorang tanpa mengharapkan balasan.","Dalam hal apa Anda lebih suka dilayani daripada melayani?","Tuhan Yesus, terima kasih telah melayani dan menebus kami. Amin."],["Dua Hukum yang Terutama","Markus 12:30-31","Hukum terutama adalah mengasihi Tuhan dengan segenap hati dan mengasihi sesama seperti diri sendiri.","Tunjukkan kasih kepada Tuhan lewat waktu bersama-Nya, dan kepada sesama lewat tindakan nyata.","Mana yang lebih sering Anda abaikan: mengasihi Tuhan atau sesama?","Tuhan, ajar kami mengasihi Engkau dan sesama dengan sungguh. Amin."],["Maria dan Marta","Lukas 10:41-42","Marta sibuk melayani, tetapi Maria memilih duduk di dekat kaki Yesus; hanya satu yang perlu.","Sisihkan waktu duduk tenang bersama Tuhan sebelum kesibukan dimulai.","Apa yang membuat Anda terlalu sibuk untuk duduk bersama Tuhan?","Tuhan, ajar kami memilih bagian yang terbaik. Amin."],["Bapa Memberikan Roh Kudus","Lukas 11:13","Bapa di surga lebih rela lagi memberikan Roh Kudus kepada mereka yang meminta kepada-Nya.","Mintalah Roh Kudus memimpin Anda dalam keputusan hari ini.","Apa yang Anda butuhkan dari Roh Kudus saat ini?","Bapa, penuhi kami dengan Roh Kudus-Mu. Amin."],["Hidup Bukan Karena Harta","Lukas 12:15","Hidup seseorang tidak tergantung pada kekayaannya; keserakahan perlu diwaspadai.","Periksa pengeluaran Anda dan beri tempat bagi syukur serta memberi.","Di mana Anda merasa kurang, padahal Tuhan sudah mencukupi?","Tuhan, lepaskan kami dari keserakahan dan ajar kami bersyukur. Amin."],["Domba yang Hilang","Lukas 15:4-6","Gembala meninggalkan sembilan puluh sembilan domba untuk mencari yang hilang dan bersukacita saat menemukannya.","Ingat seseorang yang menjauh dari Tuhan dan doakan atau hubungi dia.","Siapa yang Tuhan letakkan di hati Anda untuk dicari?","Tuhan, terima kasih Engkau mencari kami. Pakailah kami mencari yang hilang. Amin."],["Setia dalam Perkara Kecil","Lukas 16:10","Orang yang setia dalam perkara kecil juga setia dalam perkara besar; ketidaksetiaan kecil menunjukkan hati yang sama.","Mulai dari hal kecil: tepat janji, jujur, dan teliti dalam pekerjaan.","Hal kecil apa yang perlu Anda perbaiki dalam kesetiaan Anda?","Tuhan, bentuk kami menjadi pribadi yang dapat dipercaya. Amin."],["Sepuluh Orang Kusta","Lukas 17:17-19","Dari sepuluh orang yang disembuhkan hanya satu yang kembali berterima kasih, dan ia diselamatkan imannya.","Kembalilah kepada Tuhan hari ini untuk mengucap syukur atas satu berkat yang sudah diterima.","Berkat apa yang belum Anda syukuri?","Tuhan, terima kasih atas semua yang telah Engkau lakukan. Amin."],["Keselamatan Datang ke Rumah Zakheus","Lukas 19:9-10","Yesus datang untuk mencari dan menyelamatkan yang hilang; pertemuan dengan-Nya mengubah hidup Zakheus.","Terbukalah bagi Yesus untuk masuk ke bagian hidup yang selama ini Anda tutup.","Bagian hidup mana yang perlu Yesus jamah?","Tuhan Yesus, tinggallah di rumah dan hati kami. Amin."],["Berdoa dengan Tidak Jemu","Lukas 18:1","Yesus mengajar murid-murid-Nya supaya selalu berdoa dengan tidak jemu-jemu.","Pilih satu pokok doa dan doakan setiap hari minggu ini.","Doa apa yang hampir Anda hentikan?","Tuhan, kuatkan kami untuk terus berdoa dengan setia. Amin."],["Firman Menjadi Manusia","Yohanes 1:14","Firman menjadi manusia dan diam di antara kita; Allah sendiri datang dekat kepada kita dalam Yesus.","Syukuri bahwa Allah rela hadir di tengah kehidupan kita yang biasa.","Bagaimana Anda mengalami kehadiran Yesus dalam keseharian?","Tuhan Yesus, terima kasih Engkau tinggal di antara kami. Amin."],["Dilahirkan Kembali","Yohanes 3:3","Yesus berkata bahwa orang harus dilahirkan kembali untuk melihat Kerajaan Allah; ini pekerjaan Roh Kudus.","Bersyukur atas hidup baru dan ceritakan satu perubahan yang Tuhan kerjakan.","Perubahan apa yang telah Tuhan kerjakan dalam hidup Anda?","Tuhan, terima kasih atas hidup baru dalam Kristus. Amin."],["Menyembah dalam Roh dan Kebenaran","Yohanes 4:23-24","Bapa mencari penyembah yang menyembah dalam roh dan kebenaran; yang utama adalah hati, bukan tempat.","Beribadah dengan sungguh-sungguh, di mana pun Anda berada hari ini.","Apakah ibadah Anda lebih dari rutinitas?","Bapa, ajar kami menyembah-Mu dengan tulus. Amin."],["Terang Dunia","Yohanes 8:12","Yesus adalah terang dunia; siapa mengikut Dia tidak akan berjalan dalam kegelapan.","Bawa persoalan yang gelap kepada terang Yesus lewat doa dan firman.","Di mana Anda butuh terang untuk melangkah?","Tuhan Yesus, terangi jalan hidup kami. Amin."],["Kebenaran Memerdekakan","Yohanes 8:31-32","Tinggal dalam firman membuat kita mengenal kebenaran, dan kebenaran itu memerdekakan.","Baca satu bagian firman hari ini dan tanyakan apa yang membebaskan Anda.","Apa yang masih membelenggu Anda?","Tuhan, merdekakan kami oleh kebenaran-Mu. Amin."],["Membasuh Kaki Murid","Yohanes 13:14-15","Yesus, Guru dan Tuhan, membasuh kaki murid-murid-Nya sebagai teladan pelayanan.","Lakukan pelayanan sederhana yang tidak dilihat orang lain.","Pelayanan sederhana apa yang bisa Anda lakukan hari ini?","Tuhan Yesus, ajar kami melayani seperti Engkau. Amin."],["Tempat Telah Disediakan","Yohanes 14:1-3","Yesus menghibur murid-murid-Nya agar hati mereka tidak gelisah; Ia menyediakan tempat bagi kita.","Saat hati gelisah, ingat pengharapan akan rumah Bapa.","Apa yang paling membuat hati Anda gelisah?","Tuhan Yesus, teguhkan hati kami dengan pengharapan akan janji-Mu. Amin."],["Sahabat Yesus","Yohanes 15:13-15","Yesus menyebut murid-murid-Nya sahabat dan memberi nyawa-Nya bagi mereka.","Nikmati persahabatan dengan Yesus lewat bercerita jujur dalam doa.","Seberapa dekat Anda merasa dengan Yesus sebagai sahabat?","Tuhan Yesus, terima kasih menjadi sahabat kami. Amin."],["Hidup Bersekutu","Kisah Para Rasul 2:42-47","Jemaat mula-mula bertekun dalam pengajaran, persekutuan, doa, dan saling berbagi dengan sukacita.","Ikut aktif dalam komsel dan peduli pada kebutuhan anggota lain.","Bagaimana Anda dapat memperkuat persekutuan komsel?","Tuhan, jadikan komsel kami persekutuan yang hidup. Amin."],["Lebih Berbahagia Memberi","Kisah Para Rasul 20:35","Paulus mengingatkan kata Yesus: lebih berbahagia memberi daripada menerima.","Beri sesuatu hari ini, waktu, perhatian, atau materi, dengan sukacita.","Apa yang bisa Anda berikan kepada orang lain hari ini?","Tuhan, jadikan kami pemberi yang bersukacita. Amin."],["Damai dengan Allah","Roma 5:1","Karena dibenarkan oleh iman, kita beroleh damai dengan Allah melalui Yesus Kristus.","Hidup dalam damai: lepaskan rasa bersalah yang sudah diampuni.","Apa yang masih membuat Anda merasa jauh dari Tuhan?","Tuhan, terima kasih atas damai yang kami miliki di dalam Kristus. Amin."],["Roh Menolong dalam Doa","Roma 8:26","Roh Kudus menolong kelemahan kita dan berdoa bagi kita ketika kita tidak tahu bagaimana harus berdoa.","Saat kata-kata habis, tetaplah datang kepada Tuhan dengan jujur.","Apa yang sulit Anda doakan saat ini?","Roh Kudus, tolong kami berdoa sesuai kehendak Allah. Amin."],["Jika Allah di Pihak Kita","Roma 8:31-32","Allah yang tidak menyayangkan Anak-Nya sendiri pasti akan memberikan segala sesuatu bersama Dia.","Hadapi tantangan dengan keyakinan bahwa Allah ada di pihak kita.","Tantangan apa yang membuat Anda merasa sendirian?","Tuhan, terima kasih Engkau di pihak kami. Amin."],["Sabar dalam Doa","Roma 12:12","Bersukacita dalam pengharapan, sabar dalam kesesakan, dan tekun dalam doa.","Tetapkan waktu doa yang rutin, walau singkat.","Dalam hal apa Anda perlu lebih sabar dan tekun?","Tuhan, ajar kami bersukacita, sabar, dan tekun berdoa. Amin."],["Salib adalah Kekuatan Allah","1 Korintus 1:18","Bagi yang percaya, berita salib adalah kekuatan Allah, meski bagi dunia tampak bodoh.","Bangga akan salib Kristus dan jangan malu bersaksi.","Apa arti salib bagi hidup Anda hari ini?","Tuhan, terima kasih atas salib-Mu yang menyelamatkan kami. Amin."],["Berlari untuk Memperoleh Hadiah","1 Korintus 9:24-25","Orang yang bertanding menahan diri dalam segala hal; kita berlari untuk mahkota yang abadi.","Tetapkan satu disiplin rohani dan jalani dengan konsisten.","Disiplin rohani apa yang perlu Anda mulai atau perbaiki?","Tuhan, beri kami ketekunan dan penguasaan diri. Amin."],["Tuhan Menyediakan Jalan Keluar","1 Korintus 10:13","Allah setia dan tidak membiarkan kita dicobai melampaui kekuatan; Ia memberi jalan keluar.","Saat tergoda, cari jalan keluar yang Tuhan sediakan dan minta pertolongan sesama.","Pencobaan apa yang sedang Anda hadapi?","Tuhan, kuatkan kami dan tunjukkan jalan keluar. Amin."],["Satu Tubuh Banyak Anggota","1 Korintus 12:12-14","Jemaat adalah satu tubuh dengan banyak anggota, dan setiap anggota berharga.","Kenali karunia Anda dan pakai untuk membangun komsel.","Karunia apa yang Tuhan berikan untuk melayani?","Tuhan, satukan kami dan pakailah karunia kami. Amin."],["Yang Terbesar adalah Kasih","1 Korintus 13:13","Iman, pengharapan, dan kasih tetap ada, tetapi yang terbesar adalah kasih.","Tunjukkan kasih lewat satu tindakan nyata kepada keluarga atau sahabat.","Siapa yang perlu merasakan kasih Anda hari ini?","Tuhan, penuhi kami dengan kasih-Mu. Amin."],["Allah Sumber Penghiburan","2 Korintus 1:3-4","Allah menghibur kita dalam segala penderitaan supaya kita dapat menghibur orang lain.","Gunakan pengalaman sulit Anda untuk menguatkan orang lain.","Siapa yang bisa Anda hibur dengan pengalaman Anda?","Bapa, terima kasih Engkau menghibur kami. Pakailah kami menghibur sesama. Amin."],["Manusia Batiniah Dibaharui","2 Korintus 4:16-18","Walau tubuh lahiriah merosot, manusia batiniah dibaharui setiap hari; kita memandang yang kekal.","Pandanglah hal yang kekal saat menghadapi tekanan.","Apa yang terlalu menyita perhatian Anda dibanding yang kekal?","Tuhan, baharui batin kami setiap hari. Amin."],["Duta Besar Kristus","2 Korintus 5:20","Kita adalah utusan Kristus; Allah berbicara melalui kita untuk mengajak orang berdamai dengan-Nya.","Hidup sebagai duta Kristus di tempat kerja, rumah, dan lingkungan.","Bagaimana hidup Anda mencerminkan Kristus bagi orang lain?","Tuhan, pakailah kami sebagai duta-Mu. Amin."],["Saling Menanggung Beban","Galatia 6:2","Saling menolong menanggung beban adalah cara kita memenuhi hukum Kristus.","Tanyakan kabar seseorang dan tawarkan bantuan nyata.","Siapa yang sedang menanggung beban berat di sekitar Anda?","Tuhan, ajar kami saling menolong. Amin."],["Diberkati dengan Segala Berkat Rohani","Efesus 1:3","Dalam Kristus kita telah diberkati dengan segala berkat rohani di surga.","Syukuri berkat rohani yang sudah Anda terima, bukan hanya yang jasmani.","Berkat rohani apa yang paling Anda syukuri?","Bapa, terima kasih atas berkat-Mu di dalam Kristus. Amin."],["Hidup Sesuai Panggilan","Efesus 4:1-3","Hidup yang layak adalah hidup rendah hati, lemah lembut, sabar, dan menjaga kesatuan Roh.","Pilih satu sikap, misalnya sabar atau lemah lembut, untuk dilatih hari ini.","Sikap mana yang paling perlu Anda tumbuhkan?","Tuhan, bentuk karakter kami sesuai panggilan-Mu. Amin."],["Melupakan yang Telah di Belakang","Filipi 3:13-14","Paulus melupakan yang di belakang dan mengarahkan diri kepada yang di depan, mengejar panggilan Allah.","Lepaskan penyesalan masa lalu dan fokus pada langkah hari ini.","Apa dari masa lalu yang menahan Anda maju?","Tuhan, bebaskan kami dari masa lalu dan pimpin kami maju. Amin."],["Belajar Cukup","Filipi 4:11-12","Paulus belajar mencukupkan diri dalam segala keadaan, baik berkelimpahan maupun kekurangan.","Latih rasa cukup: syukuri yang ada hari ini.","Apa yang membuat Anda merasa kurang?","Tuhan, ajar kami merasa cukup di dalam Engkau. Amin."],["Saling Menguatkan","1 Tesalonika 5:11","Kita dipanggil saling menghibur dan saling membangun, sebagaimana yang sudah kita lakukan.","Kirim satu pesan penyemangat kepada anggota komsel.","Siapa yang perlu dikuatkan hari ini?","Tuhan, jadikan kami pembangun satu sama lain. Amin."],["Saling Mendorong dalam Kasih","Ibrani 10:24-25","Kita diajak saling memperhatikan untuk mendorong kasih dan perbuatan baik, dan tidak menjauh dari ibadah bersama.","Hadir dan aktif dalam persekutuan, serta dorong orang lain.","Apa yang sering membuat Anda menjauh dari persekutuan?","Tuhan, kuatkan kami bersekutu dan saling mendorong. Amin."],["Sukacita dalam Pencobaan","Yakobus 1:2-4","Berbagai pencobaan menguji iman dan menghasilkan ketekunan sampai kita menjadi dewasa dan utuh.","Lihat kesulitan sebagai kesempatan bertumbuh dan carilah hikmat Tuhan.","Apa yang sedang Tuhan ajarkan lewat kesulitan Anda?","Tuhan, beri kami ketekunan dan hikmat dalam setiap ujian. Amin."],["Cepat Mendengar, Lambat Marah","Yakobus 1:19-20","Kita diminta cepat mendengar, lambat berkata-kata, dan lambat marah, sebab amarah tidak menghasilkan kebenaran Allah.","Dengarkan dulu sebelum menanggapi dalam percakapan hari ini.","Dalam situasi apa Anda mudah marah?","Tuhan, ajar kami mendengar dan menguasai amarah. Amin."],["Siap Memberi Jawab","1 Petrus 3:15","Kuduskanlah Kristus dalam hati dan siaplah menjelaskan alasan pengharapan kita dengan lemah lembut.","Pikirkan bagaimana Anda menceritakan iman kepada orang lain dengan sederhana.","Bagaimana Anda menjelaskan pengharapan Anda dalam Kristus?","Tuhan, siapkan kami bersaksi dengan lemah lembut. Amin."],["Berjalan dalam Terang","1 Yohanes 1:7","Jika kita hidup dalam terang, kita bersekutu satu dengan yang lain, dan darah Yesus menyucikan kita.","Hidup terbuka dan jujur di hadapan Tuhan dan sesama.","Apa yang masih Anda sembunyikan dari terang?","Tuhan, sucikan kami dan tuntun kami berjalan dalam terang-Mu. Amin."],["Menjadi Teladan","1 Timotius 4:12","Meski muda, Timotius diminta menjadi teladan dalam perkataan, tingkah laku, kasih, kesetiaan, dan kemurnian.","Tunjukkan teladan lewat sikap kecil sehari-hari di depan orang lain.","Dalam hal apa Anda ingin menjadi teladan?","Tuhan, jadikan hidup kami teladan bagi sesama. Amin."],["Bertanding dengan Baik","2 Timotius 4:7-8","Paulus menyelesaikan pertandingan dan memelihara iman, menantikan mahkota kebenaran.","Tetap setia sampai akhir dan jangan menyerah dalam pelayanan.","Apa yang membuat Anda ingin berhenti?","Tuhan, kuatkan kami setia sampai akhir. Amin."],["Segala Sesuatu Dijadikan Baru","Wahyu 21:4-5","Allah akan menghapus segala air mata dan menjadikan segala sesuatu baru; tidak ada lagi maut dan duka.","Peganglah pengharapan akan janji Tuhan saat berduka.","Apa yang paling Anda rindukan dipulihkan oleh Tuhan?","Tuhan, teguhkan pengharapan kami akan langit dan bumi yang baru. Amin."]];

 return`<div class="card"><h3>Referensi renungan untuk Anda</h3>`+(l.length?`<div class="m" style="margin-bottom:8px">Referensi hanya bahan bantu. Boleh dipakai dan disesuaikan dengan pengalaman Anda, atau abaikan dan tulis renungan sendiri. Tiap referensi hanya bisa dipakai satu kali, yaitu saat renungannya diterbitkan.</div>`+l.map((o,k)=>{const d=refData(o),pk=ut.has(refKd(o));return`<div class="note"${pk?' style="opacity:.6"':''}><span class="tag">Mode ${refNm(o.m)}</span>${pk?' <span class="m">\u2714 Sudah dipakai</span>':''}<br><b>${E(d[0])}</b><br>${E(d[1])}${pk?'':`<br><button class="ghost" onclick="pakaiRef(${k})">Pakai di Tulis</button>`}</div>`}).join(''):'<div class="m">Belum ada. Referensi pertama (Mode Cepat) terbuka saat 3 renungan Anda sudah tayang.</div>')+

async function simpanRecov(){const a=$('#rp1').value,b=$('#rp2').value;
 if(a.length<8)return render('Minimal 8 karakter.');if(a!==b)return render('Kedua kata sandi tidak sama.');
 const{error}=await sb.auth.updateUser({password:a});
 if(error)return render('Gagal: '+error.message+' Kalau link sudah kedaluwarsa, minta link baru dari halaman Masuk Admin.');
 recov=false;history.replaceState(null,'',location.pathname);await enter()}
async function enter(){const{data:{user}}=await sb.auth.getUser();
 const{data}=await sb.from('anggota').select('*').eq('user_id',user.id).maybeSingle();
 if(!data){await sb.auth.signOut();me=null;scr='login';return render('Akun ini belum terdaftar sebagai anggota.')}
 me=data;tamu=false;await load();render()}
async function load(){const[a,r,m,pd,kt,kr]=await Promise.all([sb.from('anggota').select('*').order('nama'),
 sb.from('renungan').select('*').order('tanggal_tayang',{ascending:false}),sb.from('reaksi').select('*'),
 me&&me.peran==='admin'?sb.from('pendaftaran').select('*').order('dibuat_pada',{ascending:false}):Promise.resolve({data:[]}),
 sb.from('kesaksian_tayang').select('*').order('dibuat_pada',{ascending:false}),sb.from('kesaksian').select('*').order('dibuat_pada',{ascending:false})]);
 members=a.data||[];rens=r.data||[];amin=m.data||[];pendaftar=pd.data||[];
 kesTayang=kt.data||[];kesRaw=kr.data||[];kesErr=(kt.error||kr.error)?.message||'';
 if(me){const mm=members.find(x=>x.user_id===me.user_id);if(mm)me=mm}}
async function masuk(){scr='login';const u=$('#u').value.trim().toLowerCase(),p=$('#p').value.trim();
 const{error}=await sb.auth.signInWithPassword({email:u+DOM,password:p});
 if(error)return render('Nama pengguna atau PIN salah. ('+error.message+')');await enter()}
async function keluar(){await sb.auth.signOut();me=null;tamu=false;scr='pilih';render()}
async function masukTamu(){tamu=true;view=null;render();await loadTamu();render()}
let tamuErr='';
async function loadTamu(){const[r,a]=await Promise.all([sb.from('renungan').select('*').order('tanggal_tayang',{ascending:false}),sb.rpc('nama_anggota')]);
 tamuErr=(r.error||a.error)?.message||'';rens=r.data||[];members=a.data||[];amin=[]}

async function kirimDaftar(){const v=id=>$('#'+id).value.trim(),er=m=>{$('#derr').textContent=m};
 if($('#dhp').value){scr='terkirim';return render()}
 const nama=v('dn'),wa=$('#dwa').checked,em=$('#dem').checked,nw=v('dnw').replace(/[\s\-().]/g,''),ne=v('dne');
 if(nama.length<2)return er('Isi nama calon anggota.');
 if(!wa&&!em)return er('Pilih minimal satu: WhatsApp atau Email.');
 if(wa&&!/^\+?\d{8,15}$/.test(nw))return er('Nomor WhatsApp belum benar.');
 if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ne))return er('Alamat email belum benar.');
 $('#bdk').disabled=true;er('Mengirim...');
 const{error}=await sb.from('pendaftaran').insert({nama,kirim_wa:wa,nomor_wa:wa?nw:null,kirim_email:em,email:em?ne:null,catatan:v('dct')||null});
 if(error){$('#bdk').disabled=false;return er('Gagal mengirim. Coba lagi nanti. ('+error.message+')')}
 scr='terkirim';render();scrollTo(0,0)}
function terkirimH(){return`<main>${head()}<div class="card"><h2>Terima kasih</h2><p style="white-space:normal">Pendaftaran Anda sudah diterima. Admin akan mengirim nama pengguna dan PIN 6 digit ke WhatsApp atau email yang Anda isi.</p><br><button class="full" onclick="scr='pilih';render();scrollTo(0,0)">Kembali ke halaman awal</button></div></main>`}
function pTamu(){
 if(view){const r=rens.find(x=>x.id===view);return`<button class="ghost" onclick="view=null;render()">← Kembali</button>`+(r?det(r):'')}
 const t=T();let r=rens.find(x=>!x.cadangan&&x.tanggal_tayang===t);
 if(!r){const c=rens.filter(x=>x.cadangan);if(c.length)r=c[Math.floor(Date.parse(t)/864e5)%c.length]}
 const past=rens.filter(x=>!x.cadangan&&x.tanggal_tayang&&x.tanggal_tayang<=t&&(!r||x.id!==r.id)).slice(0,20);
 const by=x=>E(members.find(m=>m.user_id===x.penulis_id)?.nama||'-')+lencE(x.penulis_id,x.cadangan)+(isAdm(x.penulis_id)?' (Admin)':'');
 return`<button class="ghost" onclick="tamu=false;scr='pilih';render()">← Kembali</button>`+head()+`<h1>Selamat datang</h1><div class="m">${tgl(t)}</div>`+
 (tamuErr?`<div class="card err">Belum bisa memuat renungan. (${E(tamuErr)})</div>`:'')+
 (r?det(r):(tamuErr?'':`<div class="card"><b>Belum ada renungan hari ini.</b></div>`))+
 (past.length?`<h3>Renungan sebelumnya</h3>`+past.map(x=>`<div class="card kt" onclick="buka('${x.id}')"><span class="tag">${tgl(x.tanggal_tayang)}</span><div><b>${E(x.judul||x.ayat_ref)}</b></div><div class="m">Oleh: ${by(x)}</div></div>`).join(''):'')+
 (members.length?`<h3>Anggota</h3><div class="card m">${members.map(m=>E(m.nama)).join(', ')}</div>`:'')+
 `<div class="card"><button class="full" onclick="tamu=false;scr='login';render()">LOGIN sebagai anggota</button><div class="note"><i>Ingin ikut menulis renungan? Hubungi <span class="lnk" onclick="bukaDaftar()">admin</span>.</i></div><button class="full ghost" onclick="bukaDaftar()">Mendaftar menjadi anggota</button><button class="full ghost" onclick="bantuanTamu=true;render();scrollTo(0,0)">❓ Bantuan: cara memakai aplikasi</button></div>`}

 if(t==='tulis'){const{data}=await sb.rpc('tanggal_terisi',{dari:T(),sampai:addD(T(),6)});taken=new Set((data||[]).map(x=>x.tanggal))}
 render();scrollTo(0,0)}

function loginH(msg){return`<main><button class="ghost" onclick="scr='pilih';render()">← Kembali</button>${head()}<div class="card"><h3>Masuk</h3>

function render(msg){const A=$('#app');if(!me){A.dataset.m='';if(bantuanTamu){A.innerHTML=`<main><button class="ghost" onclick="bantuanTamu=false;render();scrollTo(0,0)">← Kembali</button>${bantuanH(false)}</main>`;return}A.innerHTML=tamu?`<main>${pTamu()}</main>`:(recov?recovH(msg):scr==='admin'?adminH(msg):scr==='login'?loginH(msg):scr==='daftar'?daftarH():scr==='terkirim'?terkirimH():pilihH());return}
 let b;if(view){const r=rens.find(x=>x.id===view);b=`<button class="ghost" onclick="view=null;render()">← Kembali</button>`+(r?det(r):'')}
 else b={beranda:pBeranda,tulis:pTulis,feed:pFeed,daftar:pDaftar,kesaksian:pKes,anggota:pAnggota,bantuan:()=>bantuanH(true)}[tab]();

const KITAB=[['Kej','kejadian'],['Kel','keluaran'],['Im','imamat'],['Bil','bilangan'],['Ul','ulangan'],['Yos','yosua'],['Hak','hakim','hakimhakim'],['Rut','rut'],['1Sam','1samuel'],['2Sam','2samuel'],['1Raj','1raja','1rajaraja'],['2Raj','2raja','2rajaraja'],['1Taw','1tawarikh'],['2Taw','2tawarikh'],['Ezr','ezra'],['Neh','nehemia'],['Est','ester'],['Ayb','ayub'],['Mzm','mazmur','psalm'],['Ams','amsal'],['Pkh','pengkhotbah'],['Kid','kidungagung','kidung'],['Yes','yesaya'],['Yer','yeremia'],['Rat','ratapan'],['Yeh','yehezkiel'],['Dan','daniel'],['Hos','hosea'],['Yl','yoel'],['Am','amos'],['Ob','obaja'],['Yun','yunus'],['Mi','mikha'],['Nah','nahum'],['Hab','habakuk'],['Zef','zefanya'],['Hag','hagai'],['Za','zakharia'],['Mal','maleakhi'],['Mat','matius'],['Mrk','markus'],['Luk','lukas'],['Yoh','yohanes'],['Kis','kisahpararasul','kisahrasul','kisah'],['Rm','roma'],['1Kor','1korintus'],['2Kor','2korintus'],['Gal','galatia'],['Ef','efesus'],['Flp','filipi'],['Kol','kolose'],['1Tes','1tesalonika'],['2Tes','2tesalonika'],['1Tim','1timotius'],['2Tim','2timotius'],['Tit','titus'],['Flm','filemon'],['Ibr','ibrani'],['Yak','yakobus'],['1Ptr','1petrus'],['2Ptr','2petrus'],['1Yoh','1yohanes'],['2Yoh','2yohanes'],['3Yoh','3yohanes'],['Yud','yudas'],['Why','wahyu']];
const KMAP={};KITAB.forEach(k=>{KMAP[k[0].toLowerCase()]=k[0];k.slice(1).forEach(a=>KMAP[a]=k[0])});
async function ambilAyat(){
 const st=$('#stAyat'),bt=$('#bAyat'),raw=$('#ayat_ref').value.trim();
 const m=raw.replace(/^(iii|ii|i)\s+/i,x=>({i:'1',ii:'2',iii:'3'})[x.trim().toLowerCase()]+' ').match(/^(.+?)\s+(\d{1,3})\s*[:.]\s*(\d{1,3})(?:\s*[-\u2013]\s*(\d{1,3}))?$/);
 if(!m){st.textContent='Tulis seperti: Filipi 1:6 atau Yohanes 3:16-17';return}
 const ab=KMAP[m[1].toLowerCase().replace(/[^a-z0-9]/g,'')];
 if(!ab){st.textContent='Nama kitab tidak dikenali. Ketik teks ayat manual.';return}
 const a=+m[3],b=m[4]?+m[4]:a;
 if(b<a||b-a>14){st.textContent='Rentang ayat tidak valid (maksimal 15 ayat).';return}
 bt.disabled=true;st.textContent='Mengambil...';
 try{
  const r=await fetch('/api/pasal?ref='+ab+'/'+m[2]);
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||r.status);
  const all=j.data?.verses||[];let teks='',tb=false;
  if(ab==='Mzm'){const full=all.map(v=>v.text).join(' ');
   if(/\(\d+\s*[-\u2013]\s*\d+\)/.test(full)){const parts=full.split(/\(\d+\s*[-\u2013]\s*(\d+)\)/),mp={},pre=parts[0].trim();if(pre)mp[1]=pre;
    for(let i=1;i<parts.length;i+=2)mp[+parts[i]]=(parts[i+1]||'').trim();
    const t=[];for(let n=a;n<=b;n++)if(mp[n])t.push(mp[n]);teks=t.join(' ');tb=true}}
  if(!tb)teks=all.filter(v=>v.verse_number>=a&&v.verse_number<=b).map(v=>v.text).join(' ');
  if(!teks)throw new Error('Ayat tidak ditemukan');
  $('#ayat_teks').value=teks;
  st.textContent=tb?'Terisi sesuai nomor ayat Alkitab TB. Boleh diedit.':'Terisi. Boleh diedit.';
 }catch(e){st.textContent='Gagal mengambil. Ketik teks ayat manual. ('+e.message+')'}
 bt.disabled=false}

function pDaftar(){const F=['semua','Sudah tayang','Belum tayang','milik saya'];
 const l=rens.filter(r=>filt==='semua'||(filt==='milik saya'?r.penulis_id===me.user_id:st(r)===filt));
 return`<h2>Daftar Renungan</h2><select onchange="filt=this.value;render()">${F.map(f=>`<option ${f===filt?'selected':''}>${f}</option>`).join('')}</select>`+
 l.map(r=>{const s=st(r),own=r.penulis_id===me.user_id,del=me.peran==='admin';
 return`<div class="card"><b onclick="buka('${r.id}')">${E(r.judul||r.ayat_ref)}</b><br><small>${s} · tayang: ${r.tanggal_tayang||'-'} · dibuat: ${r.dibuat_pada.slice(0,10)} · Oleh: ${nm(r)} · 🙏 ${amin.filter(x=>x.renungan_id===r.id).length}</small>
${own||del?`<br>${own?`<button class="ghost" onclick="mulaiEdit('${r.id}')">Edit</button>`:''}${del?`<button class="red" onclick="hapusR('${r.id}')">Hapus</button>`:''}`:''}</div>`}).join('')}
async function hapusR(id){const r=rens.find(x=>x.id===id),tayang=r&&st(r)==='Sudah tayang';
 if(!confirm(tayang?'Renungan ini SUDAH TAYANG. Hapus permanen? Renungan, reaksi Amin, dan jawaban terkait ikut hilang.':'Hapus renungan ini?'))return;
 const{data,error}=await sb.from('renungan').delete().eq('id',id).select('id');if(error)alert(error.message);else if(!data||!data.length)alert('Tidak berhasil dihapus. Server tidak mengizinkan penghapusan renungan ini.');await load();render()}

function pAnggota(){const adm=me.peran==='admin';
 return`<h2>Anggota</h2>`+lencKartu()+refKartu()+(adm?pPend()+pBackup():'')+(baru?`<div class="card"><h3>${baru.reset?'PIN berhasil direset':baru.ulang?'Undangan siap dikirim':'Anggota baru ditambahkan'}</h3><p>Nama: ${E(baru.n)}\nNama pengguna: ${E(baru.u)}\nPIN: ${E(baru.p)}${baru.mod?'\nPeran: Moderator':''}${baru.k?'\nKirim lewat: '+E(baru.k):''}</p>${(baru.wa||!baru.email)?'<button onclick="kirimWA()">Kirim lewat WhatsApp</button>':''}${baru.email?'<button onclick="kirimEmail()">Kirim lewat Email</button>':''}<button class="ghost" onclick="salinUnd()">Salin pesan</button><button class="ghost" onclick="baru=null;render()">Tutup</button></div>`:'')+members.map(m=>`<div class="card"><b>${E(m.nama)}</b> ${m.peran==='admin'?'(Admin)':m.peran==='moderator'?'(Moderator)':''}<br><small>${jmlTayang(m.user_id)} renungan tayang${lencTop(jmlTayang(m.user_id))?' · '+lencTop(jmlTayang(m.user_id))[1]+' '+lencTop(jmlTayang(m.user_id))[2]:''}${adm?' · @'+E(m.nama_pengguna):''}</small>
${adm&&m.user_id!==me.user_id?`<br>${m.peran==='admin'?'':`<button class="ghost" onclick="aturMod('${m.user_id}',${m.peran==='moderator'?'false':'true'})">${m.peran==='moderator'?'Cabut moderator':'Jadikan moderator'}</button>`}<button class="ghost" onclick="kirimUlang('${m.user_id}')">Kirim ulang undangan</button><button class="ghost" onclick="resetPin('${m.user_id}')">Reset PIN</button><button class="red" onclick="hapusA('${m.user_id}')">Hapus</button>`:''}</div>`).join('')+
 `<div class="card"><button class="ghost" onclick="gantiPin()">${adm?'Ganti kata sandi saya':'Ganti PIN saya'}</button><button class="ghost" onclick="keluar()">Keluar</button><div class="m" style="margin-top:10px">Tampilan:</div>${[['gelap','Gelap'],['terang','Terang'],['otomatis','Otomatis']].map(([k,l])=>`<button class="${tema===k?'':'ghost'}" onclick="setTema('${k}')">${l}</button>`).join('')}</div>`+
 (adm?`<div class="card"><h3>Tambah anggota</h3>${prosesId?`<div class="note">Memproses pendaftar: <b>${E(prosesNama)}</b>. <span class="lnk" onclick="prosesId=null;prosesNama='';render()">Batal</span></div>`:''}<input id="an" placeholder="Nama" value="${E(prosesNama)}"><div class="rw"><input id="au" placeholder="Nama pengguna (huruf kecil, tanpa spasi)" autocapitalize="none"><button class="ghost" onclick="$('#au').value=acakU()">Acak angka</button></div><div class="rw"><input id="ap" inputmode="numeric" maxlength="6" placeholder="PIN 6 angka"><button class="ghost" onclick="$('#ap').value=acakP()">Acak PIN</button></div><input id="aem" type="email" inputmode="email" autocapitalize="none" placeholder="Email (untuk kirim undangan, boleh kosong)" value="${E(emProses())}"><input id="awa" type="tel" inputmode="tel" placeholder="Nomor WhatsApp (untuk kirim undangan)" value="${E(waProses())}"><select id="aperan"><option value="anggota">Peran: Penulis</option><option value="moderator">Peran: Moderator (menyetujui kesaksian)</option></select><button onclick="tambah()">Tambah</button></div>`:'')}
async function gantiPin(){if(me.peran==='admin'){const q=prompt('Kata sandi baru (minimal 8 karakter):');if(!q)return;if(q.length<8)return alert('Minimal 8 karakter.');const{error:e2}=await sb.auth.updateUser({password:q});return alert(e2?e2.message:'Kata sandi diganti.')}
 const p=prompt('PIN baru (6 angka):');if(!p)return;if(!/^\d{6}$/.test(p))return alert('PIN harus 6 angka.');
 const{error}=await sb.auth.updateUser({password:p});alert(error?error.message:'PIN diganti.')}
async function tambah(){const{error}=await sb.rpc('tambah_anggota',{p_nama:$('#an').value.trim(),p_nama_pengguna:$('#au').value.trim().toLowerCase(),p_pin:$('#ap').value.trim()});
 if(error)return alert('Gagal: '+error.message);
 const px=prosesId?pendaftar.find(x=>x.id===prosesId):null;
 const em=$('#aem')?$('#aem').value.trim():'',wa=$('#awa')?$('#awa').value.trim():'',jadiMod=$('#aperan')&&$('#aperan').value==='moderator',un=$('#au').value.trim().toLowerCase();
 baru={n:$('#an').value.trim(),u:un,p:$('#ap').value.trim(),k:px?kontak(px):'',wa:wa||(px&&px.kirim_wa?px.nomor_wa:''),email:em||(px&&px.kirim_email?px.email:''),mod:false,daftar:!!px};
 if(jadiMod){await load();const mm=members.find(x=>x.nama_pengguna===un);if(mm){const{error:e3}=await sb.rpc('atur_moderator',{p_user_id:mm.user_id,p_ya:true});if(e3)alert('Anggota sudah dibuat, tetapi gagal menjadikan moderator: '+e3.message+' (pastikan kesaksian.sql sudah dijalankan).');else baru.mod=true}else alert('Anggota dibuat, tetapi belum ditemukan untuk dijadikan moderator. Gunakan tombol Jadikan moderator di daftar anggota.')}
 if(px){await sb.from('pendaftaran').update({status:'selesai'}).eq('id',px.id);prosesId=null;prosesNama=''}
 await load();render()}
function pPend(){const l=pendaftar.filter(x=>x.status==='baru'),s=pendaftar.filter(x=>x.status==='selesai');
 return`<div class="card"><h3>Pendaftar baru (${l.length})</h3>`+(l.map(x=>`<div class="note"><b>${E(x.nama)}</b><br>${E(kontak(x))}${x.catatan?'<br>Catatan: '+E(x.catatan):''}<br><small>${x.dibuat_pada.slice(0,10)}</small><br><button onclick="prosesP('${x.id}')">Proses</button><button class="red" onclick="hapusP('${x.id}')">Hapus</button></div>`).join('')||'<div class="m">Belum ada pendaftar baru.</div>')+
 (s.length?`<h3>Sudah diproses</h3>`+s.map(x=>`<div class="m" style="margin:6px 0">${E(x.nama)} · ${E(kontak(x))} <span class="lnk" onclick="hapusP('${x.id}')">hapus</span></div>`).join(''):'')+`</div>`}
function prosesP(id){const x=pendaftar.find(y=>y.id===id);if(!x)return;prosesId=id;prosesNama=x.nama;render();setTimeout(()=>{const e=$('#an');e&&e.scrollIntoView({behavior:'smooth',block:'center'})},50)}
async function hapusP(id){if(!confirm('Hapus data pendaftar ini?'))return;const{error}=await sb.from('pendaftaran').delete().eq('id',id);if(error)alert(error.message);if(prosesId===id){prosesId=null;prosesNama=''}await load();render()}
async function kirimUlang(id){const m=members.find(x=>x.user_id===id)||{};
 if(!confirm('PIN lama tidak bisa dilihat, jadi PIN baru akan dibuat untuk '+(m.nama||'anggota ini')+'. PIN lama tidak berlaku lagi. Lanjutkan?'))return;
 const p=acakP(),{error}=await sb.rpc('reset_pin',{p_user_id:id,p_pin:p});if(error)return alert(error.message);
 baru={n:m.nama||'',u:m.nama_pengguna||'',p:p,k:'',mod:m.peran==='moderator',ulang:true};render();scrollTo(0,0)}
async function salinUnd(){try{await navigator.clipboard.writeText(pesanBaru());alert('Pesan disalin. Tempel di WhatsApp atau tempat lain.')}catch(e){alert('Gagal menyalin. Pakai tombol WhatsApp atau Email.')}}
async function resetPin(id){const p=prompt('PIN baru untuk anggota ini (6 angka). Sudah diisi PIN acak, boleh diganti:',acakP());if(!p)return;
 const{error}=await sb.rpc('reset_pin',{p_user_id:id,p_pin:p});if(error)return alert(error.message);const m=members.find(x=>x.user_id===id)||{};baru={n:m.nama||'',u:m.nama_pengguna||'',p:p,k:'',reset:true};render();scrollTo(0,0)}
async function hapusA(id){if(!confirm('Hapus anggota ini?'))return;const{error}=await sb.rpc('hapus_anggota',{p_user_id:id});if(error)alert(error.message);await load();render()}
function wrap(c,t,x,y,w,lh,dry){for(const p0 of String(t).split('\n')){const p=p0.trim(),m=p.match(/^(\d+[.)]|[•\-*–])\s+/),ind=m?c.measureText(m[0]).width:0;let l='',f=1;for(const wd of p.split(' ')){const q=l+wd+' ',lw=w-(f?0:ind);if(c.measureText(q).width>lw&&l){dry||c.fillText(l,x+(f?0:ind),y+lh*.75);y+=lh;l=wd+' ';f=0}else l=q}dry||c.fillText(l,x+(f?0:ind),y+lh*.75);y+=lh}return y}
function kartu(id,full){const r=rens.find(x=>x.id===id),W=1080,P=80,w=W-2*P,B=[],H1='700 28px system-ui,sans-serif',K='#2b2622',A='#8a5a2b';
 if(r.judul)B.push(['700 54px Georgia',K,r.judul,70,30]);
 B.push(['700 42px Georgia',A,r.ayat_ref,58,10]);
 if(r.ayat_teks)B.push(['italic 40px Georgia',K,'\u201C'+r.ayat_teks+'\u201D',58,36]);
 if(full){for(const[k,l]of SECT)if(r[k]){B.push([H1,A,l.toUpperCase(),44,4]);B.push(['34px Georgia',K,cl(r[k]),50,30])}}
 else if(r.pesan_utama){B.push([H1,A,'PESAN UTAMA',44,4]);B.push(['38px Georgia',K,cl(r.pesan_utama),54,30])}
 if(tampilNama&&oleh(r))B.push(['28px system-ui,sans-serif','#7a6f65',oleh(r),40,6]);
 B.push(['28px system-ui,sans-serif','#7a6f65','GBI House Of Peace \u00B7 '+location.host,40,0]);
 const cv=document.createElement('canvas'),c=cv.getContext('2d');cv.width=W;
 const run=dry=>{let y=P+20;for(const[f,col,t,lh,g]of B){c.font=f;c.fillStyle=col;y=wrap(c,t,P,y,w,lh,dry)+g}return y};
 const h=Math.max(run(1)+P-20,full?700:1080);cv.height=h;
 c.fillStyle='#faf7f2';c.fillRect(0,0,W,h);c.fillStyle=A;c.fillRect(0,0,W,14);run(0);
 cv.toBlob(b=>{const u=URL.createObjectURL(b),f=new File([b],'renungan.jpg',{type:'image/jpeg'}),o=document.createElement('div');o.className='ov';
  o.innerHTML=`<img src="${u}"><div class="row"><a class="bt" href="${u}" download="renungan.jpg">Simpan gambar</a><button id="sg">Bagikan gambar</button><button class="ghost" id="tt">Tutup</button></div>`;
  document.body.appendChild(o);$('#tt').onclick=()=>o.remove();
  $('#sg').onclick=()=>navigator.canShare&&navigator.canShare({files:[f]})?navigator.share({files:[f],text:location.origin}).catch(()=>{}):alert('Pakai tombol Simpan gambar, lalu kirim dari galeri.')},'image/jpeg',0.92)}
/* ===== KESAKSIAN ===== */
let kesTayang=[],kesRaw=[],kesErr='',kesForm=false,kesD={j:'',i:'',a:0},kesBusy=false;
const bisaSetuju=()=>!!me&&(me.peran==='admin'||me.peran==='moderator');
const namaA=id=>members.find(m=>m.user_id===id)?.nama||'-';
const tglK=s=>tgl(new Date(Date.parse(s)+7*36e5).toISOString().slice(0,10));
const stKes={menunggu:'Menunggu persetujuan',tayang:'Sudah tayang',ditolak:'Tidak disetujui'};
function formKes(){return`<div class="card"><h3>Tulis kesaksian</h3>
<small>Judul</small><input id="kj" maxlength="120" value="${E(kesD.j)}" oninput="kesD.j=this.value">
<small>Kesaksian Anda</small><textarea id="ki" maxlength="5000" style="min-height:170px" oninput="kesD.i=this.value">${E(kesD.i)}</textarea>
<small>Tampil sebagai</small><select id="ka" onchange="kesD.a=+this.value"><option value="0" ${kesD.a?'':'selected'}>Dengan nama saya</option><option value="1" ${kesD.a?'selected':''}>Anonim</option></select>
<div class="note">${bisaSetuju()?'Karena Anda admin/moderator, kesaksian Anda langsung tayang tanpa perlu persetujuan. ':'Kesaksian tayang setelah disetujui admin atau moderator. '}Admin dan moderator dapat melihat nama asli Anda, termasuk jika Anda memilih anonim. Anggota lain hanya melihat "Anonim". Tidak ada tombol bagikan, jadi kesaksian hanya dibaca di dalam aplikasi.</div>
<button onclick="kirimKes()">Kirim</button><button class="ghost" onclick="kesForm=false;render()">Batal</button></div>`}
function pKes(){
 if(kesErr)return`<h2>Kesaksian</h2><div class="note">Fitur kesaksian belum aktif. Admin perlu menjalankan <b>kesaksian.sql</b> di Supabase lebih dulu.</div>`;
 const ap=bisaSetuju(),adm=me.peran==='admin',tunggu=kesRaw.filter(k=>k.status==='menunggu'),saya=kesRaw.filter(k=>k.penulis_id===me.user_id);
 let h=`<h2>Kesaksian</h2><div class="note">🔒 Kesaksian bersifat pribadi dan hanya untuk anggota komsel. Mohon tidak disebarkan, termasuk lewat tangkapan layar. Nama Anda tampil samar di halaman ini.</div>`;
 h+=kesForm?formKes():`<button class="full" style="margin-top:10px" onclick="kesForm=true;render()">✍️ Tulis kesaksian</button>`;
 h+=wmAwal();
 if(ap)h+=`<h3>Menunggu persetujuan (${tunggu.length})</h3>`+(tunggu.map(k=>`<div class="card"><b>${E(k.judul)}</b><br><small>Penulis: ${E(namaA(k.penulis_id))}${k.anonim?' (memilih tampil anonim)':''} · ${tglK(k.dibuat_pada)}</small><div class="sec">${rich(k.isi)}</div><button onclick="setujuKes('${k.id}','tayang')">Setujui</button><button class="ghost" onclick="setujuKes('${k.id}','ditolak')">Tolak</button>${adm?`<button class="red" onclick="hapusKes('${k.id}')">Hapus</button>`:''}</div>`).join('')||'<div class="m">Tidak ada kesaksian yang menunggu.</div>');
 if(saya.length)h+=`<h3>Kesaksian saya</h3>`+saya.map(k=>`<div class="card"><b>${E(k.judul)}</b><br><small>${stKes[k.status]||k.status} · ${k.anonim?'anonim':'dengan nama'} · ${tglK(k.dibuat_pada)}</small><br><button class="red" onclick="hapusKes('${k.id}')">Hapus</button></div>`).join('');
 h+=`<h3>Kesaksian anggota</h3>`+(kesTayang.map(k=>{const raw=ap?kesRaw.find(x=>x.id===k.id):null;
  return`<div class="card"><b>${E(k.judul)}</b><br><small>${E(k.nama_tampil)} · ${tglK(k.dibuat_pada)}</small>${raw&&raw.anonim?`<br><small>Penulis asli (hanya terlihat admin/moderator): ${E(namaA(raw.penulis_id))}</small>`:''}<div class="sec">${rich(k.isi)}</div>
<button class="${k.saya_reaksi?'on':'ghost'}" onclick="reaksiKes('${k.id}',${k.saya_reaksi?'true':'false'})">🙏 Puji Tuhan (${k.jumlah_reaksi||0})</button>${ap?`<button class="ghost" onclick="setujuKes('${k.id}','menunggu')">Tarik dari tayang</button>`:''}${adm?`<button class="red" onclick="hapusKes('${k.id}')">Hapus</button>`:''}</div>`}).join('')||'<p class="m">Belum ada kesaksian yang tayang.</p>');
 return h+'</div>'}
function wmAwal(){const n=E(me.nama).slice(0,30).replace(/'/g,'&#39;'),
 svg=`<svg xmlns='http://www.w3.org/2000/svg' width='220' height='130'><text x='12' y='80' font-family='sans-serif' font-size='15' font-weight='600' fill='rgba(128,128,128,0.18)' transform='rotate(-25 110 65)'>${n}</text></svg>`,
 u="url('data:image/svg+xml,"+encodeURIComponent(svg).replace(/'/g,'%27')+"')";
 return`<div class="wm nocopy" style="--wm:${u}">`}
['copy','cut','contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{const n=e.target&&(e.target.nodeType===1?e.target:e.target.parentElement);if(n&&n.closest&&n.closest('.nocopy'))e.preventDefault()}));
async function kirimKes(){if(kesBusy)return;const j=kesD.j.trim(),i=kesD.i.trim();
 if(j.length<3)return alert('Isi judul (minimal 3 huruf).');
 if(i.length<20)return alert('Kesaksian terlalu singkat (minimal 20 huruf).');
 kesBusy=true;const{error}=await sb.rpc('kirim_kesaksian',{p_judul:j,p_isi:i,p_anonim:!!kesD.a});kesBusy=false;
 if(error)return alert('Gagal: '+error.message);
 kesD={j:'',i:'',a:0};kesForm=false;await load();render();scrollTo(0,0);
 alert(bisaSetuju()?'Terima kasih. Kesaksian Anda langsung tayang.':'Terima kasih. Kesaksian Anda terkirim dan akan tayang setelah disetujui.')}
async function setujuKes(id,s){if(s==='ditolak'&&!confirm('Tolak kesaksian ini?'))return;if(s==='menunggu'&&!confirm('Tarik kesaksian ini dari tayang?'))return;
 const{error}=await sb.rpc('setujui_kesaksian',{p_id:id,p_status:s});if(error)return alert('Gagal: '+error.message);await load();render()}
async function hapusKes(id){if(!confirm('Hapus kesaksian ini?'))return;const{error}=await sb.from('kesaksian').delete().eq('id',id);if(error)alert(error.message);await load();render()}
async function reaksiKes(id,mine){const{error}=await(mine?sb.from('kesaksian_reaksi').delete().eq('kesaksian_id',id).eq('user_id',me.user_id):sb.from('kesaksian_reaksi').insert({kesaksian_id:id,user_id:me.user_id}));
 if(error)return alert(error.message);await load();render()}
async function aturMod(id,ya){const m=members.find(x=>x.user_id===id),n=m?.nama||'anggota ini';
 if(!confirm(ya?'Jadikan '+n+' moderator? Moderator dapat menyetujui kesaksian dan melihat nama asli penulis anonim.':'Cabut peran moderator dari '+n+'?'))return;
 const{error}=await sb.rpc('atur_moderator',{p_user_id:id,p_ya:ya});if(error)return alert('Gagal: '+error.message);await load();render()}

/* ===== EDIT RENUNGAN ===== */
let editId=null;
async function mulaiEdit(id){editId=id;await go('tulis',true)}
async function batalEdit(){editId=null;await go('daftar')}
async function simpanEdit(){const r=rens.find(x=>x.id===editId);if(!r||r.penulis_id!==me.user_id)return alert('Renungan tidak ditemukan atau bukan milik Anda.');
 const g=id=>$('#'+id)?.value.trim()||null,mode=$('#mode').value,keys=['judul',...SECT.map(x=>x[0])];
 if(!g('ayat_ref'))return alert('Isi dulu ayatnya.');
 const hilang=keys.filter(k=>!MODE[mode].includes(k)&&g(k));
 if(hilang.length&&!confirm('Mode ini tidak memuat bagian: '+hilang.map(k=>LBL[k]).join(', ')+'. Isinya akan dihapus. Lanjutkan?'))return;
 const row={mode,ayat_ref:g('ayat_ref'),ayat_teks:g('ayat_teks')};keys.forEach(k=>row[k]=MODE[mode].includes(k)?g(k):null);
 const{data,error}=await sb.from('renungan').update(row).eq('id',editId).select('id');
 if(error)return alert('Gagal: '+error.message);
 if(!data||!data.length)return alert('Tidak berhasil disimpan. Server belum mengizinkan edit (jalankan edit-renungan.sql di Supabase).');
 editId=null;await go('daftar')}


setTimeout(()=>{const sp=document.getElementById('splash');if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),600)}},5000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script></body></html>
