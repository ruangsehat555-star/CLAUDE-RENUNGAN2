<!DOCTYPE html>
<html lang="id" data-tema="gelap"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplikasi Renungan Harian</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mute:#7a6f65;--acc:#8a5a2b;--soft:#f1e6d8;--line:#e8ddd0;color-scheme:light}
:root[data-tema="gelap"]{--bg:#1d1a17;--card:#272320;--ink:#f1ebe3;--mute:#a89d92;--acc:#e0b283;--soft:#3a3027;--line:#3a342e;color-scheme:dark}
@media(prefers-color-scheme:dark){:root[data-tema="otomatis"]{--bg:#1d1a17;--card:#272320;--ink:#f1ebe3;--mute:#a89d92;--acc:#e0b283;--soft:#3a3027;--line:#3a342e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif}
main{max-width:560px;margin:auto;padding:16px 16px 100px}
h2{font-size:1.25rem;margin:.3em 0}
h3{font:700 .75rem system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:18px 0 4px}
p{margin:0;white-space:pre-wrap}
small,.m{color:var(--mute);font:.85rem/1.4 system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tag{display:inline-block;background:var(--soft);color:var(--acc);font:600 .75rem system-ui,sans-serif;padding:3px 10px;border-radius:99px}
blockquote{margin:14px 0;padding:2px 0 2px 14px;border-left:3px solid var(--acc);font-style:italic}
blockquote b{font-style:normal;color:var(--acc)}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 10px;font:inherit}
textarea{min-height:80px;resize:vertical}
small+input,small+select,small+textarea{margin-top:2px}
button{border:1px solid var(--acc);background:var(--acc);color:var(--card);padding:10px 16px;margin:4px 6px 0 0;border-radius:10px;font:600 .9rem system-ui,sans-serif;cursor:pointer}
button.ghost{background:none;color:var(--acc)}button.on{background:#2e7d32;border-color:#2e7d32;color:#fff}button.red{background:#b3261e;border-color:#b3261e;color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:8px 0;font:600 .72rem system-ui,sans-serif;color:var(--mute);cursor:pointer}
nav a.on{color:var(--acc)}nav a span{display:block;font-size:20px}
.hd{text-align:center;margin:4px 0 14px}
.logo{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;display:block;object-fit:cover}
.hd .h1{font:700 2rem/1.1 Georgia,serif}.hd .h2{font:700 1.5rem/1.2 Georgia,serif}.hd .h3{font:600 1.05rem system-ui,sans-serif;margin-top:4px;text-transform:none;letter-spacing:0;color:var(--ink)}.hd .h4{font:.8rem system-ui,sans-serif;color:var(--mute)}
.err{color:#b3261e;font:.85rem system-ui,sans-serif}
.note{background:var(--soft);border-radius:10px;padding:10px;font:.85rem/1.45 system-ui,sans-serif;margin:8px 0}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;overflow-y:auto}
.ov img{width:100%;max-width:520px;border-radius:12px;flex:none}.ov .row{position:sticky;bottom:0;background:rgba(0,0,0,.6);padding:8px;border-radius:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
a.bt{display:inline-block;border:1px solid var(--acc);background:var(--acc);color:var(--card);padding:10px 16px;border-radius:10px;font:600 .9rem system-ui,sans-serif;text-decoration:none}
h1{font-size:1.3rem;margin:4px 0 2px}
.sec p,.sec .li{font-size:1.1rem;line-height:1.75;margin:.35em 0;white-space:normal}
.sec .li{display:flex;gap:.6em}.sec .li span:first-child{flex:none;min-width:1.4em;color:var(--acc)}
.rw{display:flex;gap:6px;align-items:flex-start}.rw input{flex:1;min-width:0}.rw button{flex:none;margin:4px 0 10px;padding:10px 12px}
nav,nav a,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
nav a span{pointer-events:none}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://rxmohxdsyrkpcoayotvb.supabase.co','sb_publishable_dqWa_gAhACTgnCajjen_kA_OgFKzgUp');
const $=s=>document.querySelector(s),DOM='@komsel.example.com';
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=()=>new Date(Date.now()+7*36e5).toISOString().slice(0,10);
const addD=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
const tgl=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const SECT=[['pembukaan','Pembukaan'],['isi','Isi Renungan'],['pesan_utama','Pesan Utama'],['penerapan','Penerapan'],['refleksi','Pertanyaan Refleksi'],['doa','Doa'],['pengalaman','Pengalaman saya']];
const LBL={judul:'Judul',...Object.fromEntries(SECT)};
const MODE={cepat:['pesan_utama'],terpandu:['pesan_utama','penerapan','refleksi','doa'],lengkap:['judul','pembukaan','isi','pesan_utama','penerapan','refleksi','doa','pengalaman']};
const cl=t=>String(t??'').split('\n').map(l=>l.trim()).join('\n').replace(/\n{3,}/g,'\n\n').trim();
const rich=t=>cl(t).split('\n').map(l=>{const m=l.match(/^(\d+[.)]|[•\-*–])\s+(.+)$/);return m?`<div class="li"><span>${/^\d/.test(m[1])?m[1]:'•'}</span><span>${E(m[2])}</span></div>`:(l?`<p>${E(l)}</p>`:'')}).join('');
let tema='gelap';try{tema=localStorage.getItem('tema')||'gelap'}catch(e){}
document.documentElement.dataset.tema=tema;
function setTema(t){tema=t;try{localStorage.setItem('tema',t)}catch(e){}document.documentElement.dataset.tema=t;render()}
const acakU=()=>{let u;do{u=String(10000+Math.floor(Math.random()*90000))}while(members.some(m=>m.nama_pengguna===u));return u};
const acakP=()=>{let p;do{p=Array.from(crypto.getRandomValues(new Uint32Array(6)),x=>x%10).join('')}while(/^(\d)\1{5}$/.test(p)||'01234567890123456789'.includes(p)||'98765432109876543210'.includes(p));return p};
let baru=null;
function salinBaru(){const t=`Halo ${baru.n}, ini akun Aplikasi Renungan Harian komsel:\nNama pengguna: ${baru.u}\nPIN: ${baru.p}\nBuka: ${location.origin}\n\nPIN ini diberikan oleh admin, bukan PIN atau kata sandi Gmail/HP/akun lain milikmu.`;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Pesan disalin. Tempel di WhatsApp.')).catch(()=>prompt('Salin pesan ini:',t))}
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('nav'))e.preventDefault()});
let me=null,tab='beranda',view=null,filt='semua',taken=new Set(),members=[],rens=[],amin=[],curId=null;

async function init(){const{data:{session}}=await sb.auth.getSession();session?await enter():render()}
async function enter(){const{data:{user}}=await sb.auth.getUser();
 const{data}=await sb.from('anggota').select('*').eq('user_id',user.id).maybeSingle();
 if(!data){await sb.auth.signOut();me=null;return render('Akun ini belum terdaftar sebagai anggota.')}
 me=data;await load();render()}
async function load(){const[a,r,m]=await Promise.all([sb.from('anggota').select('*').order('nama'),
 sb.from('renungan').select('*').order('tanggal_tayang',{ascending:false}),sb.from('reaksi').select('*')]);
 members=a.data||[];rens=r.data||[];amin=m.data||[]}
async function masuk(){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value.trim();
 const{error}=await sb.auth.signInWithPassword({email:u+DOM,password:p});
 if(error)return render('Nama pengguna atau PIN salah. ('+error.message+')');await enter()}
async function keluar(){await sb.auth.signOut();me=null;render()}
async function go(t){tab=t;view=null;await load();
 if(t==='tulis'){const{data}=await sb.rpc('tanggal_terisi',{dari:T(),sampai:addD(T(),6)});taken=new Set((data||[]).map(x=>x.tanggal))}
 render();scrollTo(0,0)}
function buka(id){view=id;render();scrollTo(0,0)}

const head=()=>`<div class="hd"><img class="logo" src="${LOGO}" alt="GBI HOPE"><div class="h1">Aplikasi</div><div class="h2">Renungan Harian</div><div class="h3">GBI House Of Peace</div><div class="h4">Dibuat oleh: Mulyono</div></div>`;
function loginH(msg){return`<main>${head()}<div class="card"><h3>Masuk</h3>
<input id="u" placeholder="Nama pengguna" autocapitalize="none" autocomplete="username">
<input id="p" type="password" inputmode="numeric" maxlength="6" placeholder="PIN 6 angka" autocomplete="current-password">
<button onclick="masuk()">Masuk</button><p class="err">${msg||''}</p>
<div class="note">Nama pengguna dan PIN diberikan oleh admin. Ini bukan PIN atau kata sandi Gmail, HP, atau akun lain milik Anda.</div></div></main>`}

function render(msg){const A=$('#app');if(!me){A.innerHTML=loginH(msg);return}
 let b;if(view){const r=rens.find(x=>x.id===view);b=`<button class="ghost" onclick="view=null;render()">← Kembali</button>`+(r?det(r):'')}
 else b={beranda:pBeranda,tulis:pTulis,feed:pFeed,daftar:pDaftar,anggota:pAnggota}[tab]();
 const N=[['beranda','🏠','Beranda'],['tulis','✍️','Tulis'],['feed','📖','Feed'],['daftar','📋','Daftar'],['anggota','👥','Anggota']];
 A.innerHTML=`<main>${b}</main><nav>${N.map(n=>`<a class="${tab==n[0]&&!view?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</a>`).join('')}</nav>`;
 if($('#jw'))loadJw()}

function det(r){curId=r.id;const au=members.find(m=>m.user_id===r.penulis_id);
 const by=r.cadangan?`Oleh: ${E(au?.nama||'Admin')} (Admin)`:`Oleh: ${E(au?.nama||'-')}`;
 const n=amin.filter(x=>x.renungan_id===r.id).length,mine=amin.some(x=>x.renungan_id===r.id&&x.user_id===me.user_id);
 const nx=rens.filter(x=>!x.cadangan&&x.tanggal_tayang>(r.tanggal_tayang||T())&&x.tanggal_tayang<=T()).sort((a,b)=>a.tanggal_tayang<b.tanggal_tayang?-1:1)[0];
 let h=`<div class="card"><span class="tag">${r.tanggal_tayang?tgl(r.tanggal_tayang):'Renungan Admin'}</span> <small>${by}</small>${r.judul?`<h2>${E(r.judul)}</h2>`:''}
<blockquote><b>${E(r.ayat_ref)}</b>${r.ayat_teks?`<br>${E(r.ayat_teks)}`:''}</blockquote>`;
 for(const[k,l]of SECT){if(!r[k])continue;h+=`<h3>${l}</h3><div class="sec">${rich(r[k])}</div>`;
  if(k==='refleksi')h+=`<h3>Jawaban Anda</h3><textarea id="jw"></textarea><button class="ghost" onclick="simpanJw()">Simpan jawaban</button>`}
 h+=`<div style="margin-top:12px"><button class="${mine?'on':''}" onclick="toggleAmin('${r.id}')">🙏 Amin (${n})</button>
<button class="ghost" onclick="bagikan('${r.id}',0)">Bagikan ringkas</button><button class="ghost" onclick="bagikan('${r.id}',1)">Bagikan lengkap</button><button class="ghost" onclick="kartu('${r.id}',0)">Kartu ringkas</button><button class="ghost" onclick="kartu('${r.id}',1)">Kartu panjang</button>
${nx?`<button class="ghost" onclick="buka('${nx.id}')">Lihat Renungan Berikutnya →</button>`:''}</div></div>`;return h}

async function loadJw(){const{data}=await sb.from('jawaban').select('isi').eq('renungan_id',curId).eq('user_id',me.user_id).maybeSingle();if(data&&$('#jw'))$('#jw').value=data.isi}
async function simpanJw(){const v=$('#jw').value.trim();
 const q=v?sb.from('jawaban').upsert({renungan_id:curId,user_id:me.user_id,isi:v,diperbarui_pada:new Date().toISOString()}):sb.from('jawaban').delete().eq('renungan_id',curId).eq('user_id',me.user_id);
 const{error}=await q;alert(error?'Gagal: '+error.message:'Jawaban tersimpan.')}
async function toggleAmin(id){const mine=amin.some(x=>x.renungan_id===id&&x.user_id===me.user_id);
 const{error}=mine?await sb.from('reaksi').delete().eq('renungan_id',id).eq('user_id',me.user_id):await sb.from('reaksi').insert({renungan_id:id,user_id:me.user_id});
 if(error)return alert(error.message);amin=(await sb.from('reaksi').select('*')).data||[];render()}
function bagikan(id,full){const r=rens.find(x=>x.id===id);let t=(full&&r.judul?`*${r.judul}*\n`:'')+`*${r.ayat_ref}*\n${r.ayat_teks||''}\n`;
 if(full){for(const[k,l]of SECT)if(r[k])t+=`\n*${l}*\n${cl(r[k])}\n`}else if(r.pesan_utama)t+=`\n${cl(r.pesan_utama)}\n`;
 t+=`\nBaca di: ${location.origin}`;navigator.share?navigator.share({text:t}).catch(()=>{}):window.open('https://wa.me/?text='+encodeURIComponent(t))}

function pBeranda(){const t=T();let r=rens.find(x=>!x.cadangan&&x.tanggal_tayang===t),inv='';
 if(!r){const c=rens.filter(x=>x.cadangan);if(c.length)r=c[Math.floor(Date.parse(t)/864e5)%c.length];
  inv=`<div class="card"><b>Hari ini belum ada yang menulis.</b><div class="m">Tidak apa-apa, kalau ada waktu boleh berbagi renungan. Mau sekarang berbagi?</div><button onclick="go('tulis')">Saya yang tulis hari ini</button></div>`}
 return head()+`<h1>Selamat datang, ${E(me.nama)}</h1><div class="m">${tgl(t)}</div>`+inv+(r?det(r):'')}

function pTulis(){const t=T(),adm=me.peran==='admin';let o='';
 for(let i=0;i<7;i++){const d=addD(t,i),x=taken.has(d);o+=`<option value="${d}" ${x?'disabled':''}>${x?'✓ ':''}${new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})}${x?' (terisi)':''}</option>`}
 const f=(k,rows)=>`<div class="f" data-k="${k}" ${MODE.cepat.includes(k)?'':'style="display:none"'}><small>${LBL[k]}</small><textarea id="${k}" style="min-height:${rows}px"></textarea></div>`;
 return`<div class="card"><h3>Tulis renungan</h3><small>Tanggal tayang</small><select id="tgl">${o}</select>
${adm?`<label><input type="checkbox" id="cad" style="width:auto" onchange="$('#tgl').disabled=this.checked"> Simpan sebagai Renungan Admin</label>`:''}
<small>Mode</small><select id="mode" onchange="setMode(this.value)"><option value="cepat">Cepat</option><option value="terpandu">Terpandu</option><option value="lengkap">Lengkap</option></select>
<small>Ayat (mis. Filipi 1:6 atau Yohanes 3:16-17)</small><input id="ayat_ref"><button type="button" class="ghost" id="bAyat" onclick="ambilAyat()">Ambil teks ayat</button> <small id="stAyat"></small><br><small>Teks ayat</small><textarea id="ayat_teks"></textarea>
${f('judul',40)}${f('pembukaan',80)}${f('isi',120)}${f('pesan_utama',80)}${f('penerapan',80)}${f('refleksi',60)}${f('doa',80)}${f('pengalaman',80)}
<button onclick="kirim()">Terbitkan</button></div>`}
const KITAB=[['Kej','kejadian'],['Kel','keluaran'],['Im','imamat'],['Bil','bilangan'],['Ul','ulangan'],['Yos','yosua'],['Hak','hakim','hakimhakim'],['Rut','rut'],['1Sam','1samuel'],['2Sam','2samuel'],['1Raj','1raja','1rajaraja'],['2Raj','2raja','2rajaraja'],['1Taw','1tawarikh'],['2Taw','2tawarikh'],['Ezr','ezra'],['Neh','nehemia'],['Est','ester'],['Ayb','ayub'],['Mzm','mazmur','psalm'],['Ams','amsal'],['Pkh','pengkhotbah'],['Kid','kidungagung','kidung'],['Yes','yesaya'],['Yer','yeremia'],['Rat','ratapan'],['Yeh','yehezkiel'],['Dan','daniel'],['Hos','hosea'],['Yl','yoel'],['Am','amos'],['Ob','obaja'],['Yun','yunus'],['Mi','mikha'],['Nah','nahum'],['Hab','habakuk'],['Zef','zefanya'],['Hag','hagai'],['Za','zakharia'],['Mal','maleakhi'],['Mat','matius'],['Mrk','markus'],['Luk','lukas'],['Yoh','yohanes'],['Kis','kisahpararasul','kisahrasul','kisah'],['Rm','roma'],['1Kor','1korintus'],['2Kor','2korintus'],['Gal','galatia'],['Ef','efesus'],['Flp','filipi'],['Kol','kolose'],['1Tes','1tesalonika'],['2Tes','2tesalonika'],['1Tim','1timotius'],['2Tim','2timotius'],['Tit','titus'],['Flm','filemon'],['Ibr','ibrani'],['Yak','yakobus'],['1Ptr','1petrus'],['2Ptr','2petrus'],['1Yoh','1yohanes'],['2Yoh','2yohanes'],['3Yoh','3yohanes'],['Yud','yudas'],['Why','wahyu']];
const KMAP={};KITAB.forEach(k=>{KMAP[k[0].toLowerCase()]=k[0];k.slice(1).forEach(a=>KMAP[a]=k[0])});
async function ambilAyat(){
 const st=$('#stAyat'),bt=$('#bAyat'),raw=$('#ayat_ref').value.trim();
 const m=raw.replace(/^(iii|ii|i)\s+/i,x=>({i:'1',ii:'2',iii:'3'})[x.trim().toLowerCase()]+' ').match(/^(.+?)\s+(\d{1,3})\s*[:.]\s*(\d{1,3})(?:\s*[-\u2013]\s*(\d{1,3}))?$/);
 if(!m){st.textContent='Tulis seperti: Filipi 1:6 atau Yohanes 3:16-17';return}
 const ab=KMAP[m[1].toLowerCase().replace(/[^a-z0-9]/g,'')];
 if(!ab){st.textContent='Nama kitab tidak dikenali. Ketik teks ayat manual.';return}
 const a=+m[3],b=m[4]?+m[4]:a;
 if(b<a||b-a>14){st.textContent='Rentang ayat tidak valid (maksimal 15 ayat).';return}
 bt.disabled=true;st.textContent='Mengambil...';
 try{
  const r=await fetch('/api/pasal?ref='+ab+'/'+m[2]);
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||r.status);
  const vs=(j.data?.verses||[]).filter(v=>v.verse_number>=a&&v.verse_number<=b);
  if(!vs.length)throw new Error('Ayat tidak ditemukan');
  $('#ayat_teks').value=vs.map(v=>v.text).join(' ');
  st.textContent='Terisi. Boleh diedit.';
 }catch(e){st.textContent='Gagal mengambil. Ketik teks ayat manual. ('+e.message+')'}
 bt.disabled=false}
function setMode(m){document.querySelectorAll('.f').forEach(e=>e.style.display=MODE[m].includes(e.dataset.k)?'':'none')}
async function kirim(){const g=id=>$('#'+id)?.value.trim()||null,mode=$('#mode').value,cad=!!$('#cad')?.checked;
 const row={penulis_id:me.user_id,mode,ayat_ref:g('ayat_ref'),ayat_teks:g('ayat_teks'),cadangan:cad,tanggal_tayang:cad?null:$('#tgl').value};
 if(!row.ayat_ref)return alert('Isi dulu ayatnya.');MODE[mode].forEach(k=>row[k]=g(k));
 const{error}=await sb.from('renungan').insert(row);
 if(error)return alert(error.code==='23505'?'Tanggal itu sudah terisi.':error.code==='42501'?'Gagal: batas 3 renungan belum tayang sudah tercapai.':'Gagal: '+error.message);
 await go('daftar')}

function nm(r){const a=members.find(m=>m.user_id===r.penulis_id);return r.cadangan?'Admin':(a?.nama||'-')}
function pFeed(){const l=rens.filter(r=>!r.cadangan&&r.tanggal_tayang<=T());
 return`<h2>Feed Renungan</h2>`+(l.map(r=>`<div class="card" onclick="buka('${r.id}')"><small>${tgl(r.tanggal_tayang)} · Oleh: ${E(nm(r))}</small><br><b>${E(r.judul||r.ayat_ref)}</b><p>${E((r.pesan_utama||'').slice(0,140))}</p><small>🙏 ${amin.filter(x=>x.renungan_id===r.id).length}</small></div>`).join('')||'<p class="m">Belum ada renungan tayang.</p>')}
function st(r){return r.cadangan?'Stok Admin':r.tanggal_tayang>T()?'Belum tayang':'Sudah tayang'}
function pDaftar(){const F=['semua','Sudah tayang','Belum tayang','milik saya'];
 const l=rens.filter(r=>filt==='semua'||(filt==='milik saya'?r.penulis_id===me.user_id:st(r)===filt));
 return`<h2>Daftar Renungan</h2><select onchange="filt=this.value;render()">${F.map(f=>`<option ${f===filt?'selected':''}>${f}</option>`).join('')}</select>`+
 l.map(r=>{const s=st(r),del=s!=='Sudah tayang'&&(me.peran==='admin'||r.penulis_id===me.user_id);
 return`<div class="card"><b onclick="buka('${r.id}')">${E(r.judul||r.ayat_ref)}</b><br><small>${s} · tayang: ${r.tanggal_tayang||'-'} · dibuat: ${r.dibuat_pada.slice(0,10)} · Oleh: ${E(nm(r))} · 🙏 ${amin.filter(x=>x.renungan_id===r.id).length}</small>
${del?`<br><button class="red" onclick="hapusR('${r.id}')">Hapus</button>`:''}</div>`}).join('')}
async function hapusR(id){if(!confirm('Hapus renungan ini?'))return;const{error}=await sb.from('renungan').delete().eq('id',id);if(error)alert(error.message);await load();render()}

function pAnggota(){const adm=me.peran==='admin';
 return`<h2>Anggota</h2>`+(baru?`<div class="card"><h3>Anggota baru ditambahkan</h3><p>Nama: ${E(baru.n)}\nNama pengguna: ${E(baru.u)}\nPIN: ${E(baru.p)}</p><button onclick="salinBaru()">Salin pesan untuk anggota</button><button class="ghost" onclick="baru=null;render()">Tutup</button></div>`:'')+members.map(m=>`<div class="card"><b>${E(m.nama)}</b> ${m.peran==='admin'?'(Admin)':''}<br><small>${rens.filter(r=>r.penulis_id===m.user_id&&!r.cadangan&&r.tanggal_tayang<=T()).length} renungan tayang${adm?' · @'+E(m.nama_pengguna):''}</small>
${adm&&m.user_id!==me.user_id?`<br><button class="ghost" onclick="resetPin('${m.user_id}')">Reset PIN</button><button class="red" onclick="hapusA('${m.user_id}')">Hapus</button>`:''}</div>`).join('')+
 `<div class="card"><button class="ghost" onclick="gantiPin()">Ganti PIN saya</button><button class="ghost" onclick="keluar()">Keluar</button><div class="m" style="margin-top:10px">Tampilan:</div>${[['gelap','Gelap'],['terang','Terang'],['otomatis','Otomatis']].map(([k,l])=>`<button class="${tema===k?'':'ghost'}" onclick="setTema('${k}')">${l}</button>`).join('')}</div>`+
 (adm?`<div class="card"><h3>Tambah anggota</h3><input id="an" placeholder="Nama"><div class="rw"><input id="au" placeholder="Nama pengguna (huruf kecil, tanpa spasi)" autocapitalize="none"><button class="ghost" onclick="$('#au').value=acakU()">Acak angka</button></div><div class="rw"><input id="ap" inputmode="numeric" maxlength="6" placeholder="PIN 6 angka"><button class="ghost" onclick="$('#ap').value=acakP()">Acak PIN</button></div><button onclick="tambah()">Tambah</button></div>`:'')}
async function gantiPin(){const p=prompt('PIN baru (6 angka):');if(!p)return;if(!/^\d{6}$/.test(p))return alert('PIN harus 6 angka.');
 const{error}=await sb.auth.updateUser({password:p});alert(error?error.message:'PIN diganti.')}
async function tambah(){const{error}=await sb.rpc('tambah_anggota',{p_nama:$('#an').value.trim(),p_nama_pengguna:$('#au').value.trim().toLowerCase(),p_pin:$('#ap').value.trim()});
 if(error)return alert('Gagal: '+error.message);baru={n:$('#an').value.trim(),u:$('#au').value.trim().toLowerCase(),p:$('#ap').value.trim()};await load();render()}
async function resetPin(id){const p=prompt('PIN baru untuk anggota ini (6 angka). Sudah diisi PIN acak, boleh diganti:',acakP());if(!p)return;
 const{error}=await sb.rpc('reset_pin',{p_user_id:id,p_pin:p});alert(error?error.message:'PIN direset menjadi '+p+'. Beri tahu anggota yang bersangkutan.')}

function wrap(c,t,x,y,w,lh,dry){for(const p0 of String(t).split('\n')){const p=p0.trim(),m=p.match(/^(\d+[.)]|[•\-*–])\s+/),ind=m?c.measureText(m[0]).width:0;let l='',f=1;for(const wd of p.split(' ')){const q=l+wd+' ',lw=w-(f?0:ind);if(c.measureText(q).width>lw&&l){dry||c.fillText(l,x+(f?0:ind),y+lh*.75);y+=lh;l=wd+' ';f=0}else l=q}dry||c.fillText(l,x+(f?0:ind),y+lh*.75);y+=lh}return y}
function kartu(id,full){const r=rens.find(x=>x.id===id),W=1080,P=80,w=W-2*P,B=[],H1='700 28px system-ui,sans-serif',K='#2b2622',A='#8a5a2b';
 if(full&&r.judul)B.push(['700 54px Georgia',K,r.judul,70,30]);
 B.push(['700 42px Georgia',A,r.ayat_ref,58,10]);
 if(r.ayat_teks)B.push(['italic 40px Georgia',K,'\u201C'+r.ayat_teks+'\u201D',58,36]);
 if(full){for(const[k,l]of SECT)if(r[k]){B.push([H1,A,l.toUpperCase(),44,4]);B.push(['34px Georgia',K,cl(r[k]),50,30])}}
 else if(r.pesan_utama){B.push([H1,A,'PESAN UTAMA',44,4]);B.push(['38px Georgia',K,cl(r.pesan_utama),54,30])}
 B.push(['28px system-ui,sans-serif','#7a6f65','GBI House Of Peace \u00B7 '+location.host,40,0]);
 const cv=document.createElement('canvas'),c=cv.getContext('2d');cv.width=W;
 const run=dry=>{let y=P+20;for(const[f,col,t,lh,g]of B){c.font=f;c.fillStyle=col;y=wrap(c,t,P,y,w,lh,dry)+g}return y};
 const h=Math.max(run(1)+P-20,full?700:1080);cv.height=h;
 c.fillStyle='#faf7f2';c.fillRect(0,0,W,h);c.fillStyle=A;c.fillRect(0,0,W,14);run(0);
 cv.toBlob(b=>{const u=URL.createObjectURL(b),f=new File([b],'renungan.png',{type:'image/png'}),o=document.createElement('div');o.className='ov';
  o.innerHTML=`<img src="${u}"><div class="row"><a class="bt" href="${u}" download="renungan.png">Simpan gambar</a><button id="sg">Bagikan gambar</button><button class="ghost" id="tt">Tutup</button></div>`;
  document.body.appendChild(o);$('#tt').onclick=()=>o.remove();
  $('#sg').onclick=()=>navigator.canShare&&navigator.canShare({files:[f]})?navigator.share({files:[f],text:location.origin}).catch(()=>{}):alert('Pakai tombol Simpan gambar, lalu kirim dari galeri.')})}
